{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="user_moneylog" data-operate-edit="{:$auth->check('user.moneylog/edit')}" data-operate-del="{:$auth->check('user.moneylog/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('user.moneylog/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('user.moneylog/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('user.moneylog/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
    
</script>

<script>
layui.use(["badou", "table"], function () {
    var bdTable = layui.bdTable;
    var table = layui.table;
    bdTable.api.init({
        table: table,
        extend: {
            index_url: "user.moneylog/index",
            add_url: "user.moneylog/add",
            edit_url: "user.moneylog/edit",
            del_url: "user.moneylog/del",
            multi_url: "user.moneylog/multi",
            table: "user_money_log",
        },
    });
    bdTable.render({
        elem: "#user_moneylog",
        url: "{:url('user.moneylog/index')}",
        pk: "id",
        sortName: "id",
        even: true,
        toolbar: "#toolbar",
        cols: [[
                    { type: "checkbox" },
                    { field: "id", title: __('Id'), width: 80, sort: true },
                    { field: "user_id", title: __('UserId'), searchType: 'remoteSelect' },
                    { field: "money", title: __('Money') },
                    { field: "before", title: __('Before') },
                    { field: "after", title: __('After') },
                    { field: "memo", title: __('Memo'), operate: 'LIKE' },
                    { field: "createtime", title: __('Createtime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { title: __("Operate"), width: 180, templet: bdTable.api.formatter.operate }
        ]],
    });
});
</script>
