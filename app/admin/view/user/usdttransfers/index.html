{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="user_usdttransfers" data-operate-edit="{:$auth->check('user.usdttransfers/edit')}" data-operate-del="{:$auth->check('user.usdttransfers/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('user.usdttransfers/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('user.usdttransfers/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('user.usdttransfers/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
    
</script>

<script>
layui.use(["badou", "table"], function () {
    var bdTable = layui.bdTable;
    var table = layui.table;
    bdTable.api.init({
        table: table,
        extend: {
            index_url: "user.usdttransfers/index",
            add_url: "user.usdttransfers/add",
            edit_url: "user.usdttransfers/edit",
            del_url: "user.usdttransfers/del",
            multi_url: "user.usdttransfers/multi",
            table: "usdt_transfers",
        },
    });
    bdTable.render({
        elem: "#user_usdttransfers",
        url: "{:url('user.usdttransfers/index')}",
        pk: "id",
        sortName: "id",
        even: true,
        toolbar: "#toolbar",
        cols: [[
                    { type: "checkbox" },
                    { field: "id", title: __('Id'), width: 80, sort: true },
                    { field: "order_no", title: __('OrderNo'), operate: 'LIKE' },
                    { field: "user_id", title: __('UserId'), searchType: 'remoteSelect' },
                    // { field: "task_id_text", title: __('TaskId'), searchList: ["__('TaskId0'),"__('TaskId1')"], searchType: 'remoteSelect', templet: bdTable.api.formatter.status },
                    { field: "token_symbol_text", title: __('TokenSymbol'), searchList: {"USDT":__('USDT')}, templet: bdTable.api.formatter.status },
                    { field: "from_address", title: __('FromAddress'), operate: 'LIKE' },
                    { field: "to_address", title: __('ToAddress'), operate: 'LIKE' },
                    { field: "amount", title: __('Amount') },
                    { field: "handingfee", title: __('Handingfee') },
                    { field: "deduc", title: __('Deduc') },
                    { field: "amount_wei", title: __('AmountWei') },
                    { field: "nonce", title: __('Nonce') },
                    { field: "tx_hash", title: __('TxHash'), operate: 'LIKE' },
                    { field: "raw_tx", title: __('RawTx') },
                    { field: "status_text", title: __('Status'), templet: bdTable.api.formatter.status },
                    { field: "block_number", title: __('BlockNumber') },
                    { field: "created_at", title: __('CreatedAt'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { field: "updated_at", title: __('UpdatedAt'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { title: __("Operate"), width: 180, templet: bdTable.api.formatter.operate }
        ]],
    });
});
</script>
