{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="rule" data-operate-edit="{:$auth->check('user.user/edit')}" data-operate-del="{:$auth->check('user.user/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
	<a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black	"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('user.user/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
	<button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('user.user/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
	<button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('user.user/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
</script>

<!-- 表格自定义适配样式：防止表头标题换行挤压、与排序图标重叠 -->
<style>
    .layui-table th {
        white-space: nowrap !important;
    }
    .layui-table-cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<script>
    layui.use(["badou"], function () {
        var bdTable = layui.bdTable;
        var treeTable = layui.treeTable;
        var layer = layui.layer;
        var dropdown = layui.dropdown;
        var http = layui.bdHttp;
        
        // 添加充值按钮配置
        bdTable.button.recharge = {
            name: 'recharge',
            icon: 'fa fa-plus-circle',
            title: '充值',
            extend: "lay-event='recharge'",
            classname: 'layui-btn layui-bg-orange layui-btn-sm',
        };
        
        // 重写 formatter.operate 添加充值按钮
        bdTable.api.formatter.operate_old = bdTable.api.formatter.operate;
        bdTable.api.formatter.operate = function (data) {
            var buttons = $.extend([], this.buttons || []);
            var names = [];
            buttons.forEach(function (item) {
                names.push(item.name);
            });
            if (bdTable.extend.recharge_url && names.indexOf('recharge') === -1) {
                buttons.push(bdTable.button.recharge);
            }
            if (bdTable.extend.edit_url !== '' && names.indexOf('edit') === -1) {
                buttons.push(bdTable.button.edit);
            }
            if (bdTable.extend.del_url !== '' && names.indexOf('del') === -1) {
                buttons.push(bdTable.button.del);
            }
            return bdTable.api.buttonlink(data, buttons, 'operate');
        };
        
        bdTable.api.init({
            table: treeTable,
            extend: {
                index_url: "user.user/index"+ location.search,
                add_url: "user.user/add",
                edit_url: "user.user/edit",
                del_url: "user.user/del",
                multi_url: "user.user/multi",
                recharge_url: "user.user/recharge",
                dorecharge_url: "user.user/dorecharge",
                table: "user",
            },
        });
        bdTable.render({
            elem: "#rule",
            url: "{:url('user.user/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cellMinWidth: 110,
            cols: [
                [
                    { type: "checkbox", width: 50, fixed: "left" },
                    { field: "id", title: "ID", width: 70, sort: true, fixed: "left" },
                    { field: "group_id", title: __('Group'), width: 80, searchType: "remoteSelect",
                extend: 'data-source="user.group/selectpage" data-field="name" data-multiple="false"', hide: true },
                    { field: 'user_group.name', title: __('Group'), minWidth: 100, operate: false },
                    { field: "lv_vip", title: __('Vip'), width: 80, searchType: "remoteSelect",
                        extend: 'data-source="user.lvvip/selectpage" data-field="name" data-multiple="false"', hide: true, visible: false },
                    { field: 'user_lv_vip.name', title: __('Vip'), minWidth: 100, operate: false },
                    { field: "lv_team", title: __('Team'), width: 80, searchType: "remoteSelect",
                        extend: 'data-source="user.lvteam/selectpage" data-field="name" data-multiple="false"', hide: true, visible: false },
                    { field: 'user_lv_team.name', title: __('Team'), minWidth: 100, operate: false },
                    { field: "username", title: "用户名", minWidth: 120, operate: 'like' },
					{ field: 'nickname', title: __('Nickname'), minWidth: 120, operate: 'LIKE' },
					{ field: 'email', title: __('Email'), minWidth: 180, operate: 'LIKE' },
					{ field: 'mobile', title: __('Mobile'), minWidth: 130, operate: 'LIKE' },
					{ field: 'invite_code', title: '邀请码', minWidth: 110, operate: 'LIKE' },
					{ field: 'inviter.username', title: '推荐人', minWidth: 150, operate: false, templet: function(d) { return d.inviter ? (d.inviter.nickname || d.inviter.username) + ' (ID:' + d.inviter.id + ')' : '<span style="color:#999;">-</span>'; }},
					{ field: 'wallet_address', title: '钱包地址', minWidth: 180, operate: 'LIKE', templet: function(d) {
						if (!d.wallet_address) return '<span style="color:#999;">未绑定</span>';
						return '<span title="' + d.wallet_address + '" style="font-family:monospace;font-size:12px;">' + d.wallet_address.substring(0, 6) + '...' + d.wallet_address.substring(d.wallet_address.length - 4) + '</span>';
					}},
					{ field: 'avatar', title: __('Avatar'), width: 80, align: "center", templet: bdTable.api.formatter.image, operate: false },
					{ field: 'level', title: __('Level'), width: 80, align: "center", operate: 'BETWEEN', sortable: true },
					{ field: 'gender', title: __('Gender'), width: 80, align: "center", visible: false, searchList: {1: __('Male'), 0: __('Female')} },
					{ field: 'money', title: __('Money'), width: 90, align: "center", operate: 'BETWEEN', sortable: true },
                    { field: 'score', title: __('Score'), width: 90, align: "center", operate: 'BETWEEN', sortable: true, hide: true, visible: false },
					{ field: 'logintime_text', title: __('Logintime'), minWidth: 165, templet: bdTable.api.formatter.datetime, operate: false },
                    { field: 'logintime', title: __('Logintime'), templet: bdTable.api.formatter.datetime, searchType: 'time', hide: true },
					{ field: 'loginip', title: __('Loginip'), minWidth: 130 },
					{ field: 'jointime_text', title: __('Jointime'), minWidth: 165, templet: bdTable.api.formatter.datetime, operate: false },
                    { field: 'jointime', title: __('Jointime'), templet: bdTable.api.formatter.datetime, searchType: 'time', hide: true },
					{ field: 'joinip', title: __('Joinip'), minWidth: 130 },
                    {
                        field: "status",
                        title: "状态",
                        width: 90,
                        align: "center",
                        searchList: { normal: "正常", hidden: "隐藏" },
                        custom: { normal: "green", hidden: "orange" },
                        templet: bdTable.api.formatter.status,
                    },
                    { title: "操作", width: 180, align: "center", fixed: "right", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
