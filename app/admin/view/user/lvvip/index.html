{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="user_lvvip" data-operate-edit="{:$auth->check('user.lvvip/edit')}" data-operate-del="{:$auth->check('user.lvvip/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('user.lvvip/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('user.lvvip/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('user.lvvip/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
    
</script>

<script>
layui.use(["badou", "table"], function () {
    var bdTable = layui.bdTable;
    var table = layui.table;
    bdTable.api.init({
        table: table,
        extend: {
            index_url: "user.lvvip/index",
            add_url: "user.lvvip/add",
            edit_url: "user.lvvip/edit",
            del_url: "user.lvvip/del",
            multi_url: "user.lvvip/multi",
            table: "user_lv_vip",
        },
    });
    bdTable.render({
        elem: "#user_lvvip",
        url: "{:url('user.lvvip/index')}",
        pk: "id",
        sortName: "id",
        even: true,
        toolbar: "#toolbar",
        cols: [[
                    { type: "checkbox" },
                    { field: "id", title: __('Id'), width: 80, sort: true },
                    { field: "name", title: __('Name'), operate: 'LIKE' },
                    { field: "cost", title: __('Cost') },
                    { field: "dis", title: __('Dis') },
                    { field: "start_time", title: __('StartTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { field: "end_time", title: __('EndTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { field: "description", title: __('Description'), operate: 'LIKE' },
                    { field: "status_text", title: __('Status'), templet: bdTable.api.formatter.status },
                    { field: "create_time", title: __('CreateTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { field: "update_time", title: __('UpdateTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { title: __("Operate"), width: 180, templet: bdTable.api.formatter.operate }
        ]],
    });
});
</script>
