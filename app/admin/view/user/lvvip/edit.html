{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="{$row.name|default=''|htmlentities}" class="layui-input" autocomplete="off" lay-verify="required">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Cost')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[cost]" value="{$row.cost|default=''|htmlentities}" class="layui-input" autocomplete="off">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Dis')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[dis]" value="{$row.dis|default=''|htmlentities}" class="layui-input" autocomplete="off">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('StartTime')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[start_time]" value="{$row.start_time|default=''|htmlentities}" class="layui-input laydate" autocomplete="off">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('EndTime')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[end_time]" value="{$row.end_time|default=''|htmlentities}" class="layui-input laydate" autocomplete="off">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Description')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[description]" value="{$row.description|default=''|htmlentities}" class="layui-input" autocomplete="off" lay-verify="required">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            {foreach name="StatusList" item="vo"}
            <input type="radio" name="row[status]" value="{$key}" title="{$vo}" {in name="key" value="$row.status"}checked{/in}>
            {/foreach}
        </div>
    </div>
    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <input type="hidden" name="row[id]" value="{$row.id}">
            <button class="layui-btn btn-theme-color" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>
<script>
layui.use(["badou"], function () {
    layui.bdForm.api.bindevent($("form.layui-form"));
});
</script>
