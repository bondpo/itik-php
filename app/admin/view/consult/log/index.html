{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="consultlog" data-operate-messages="{:$auth->check('consult.log/messages')}" data-operate-del="{:$auth->check('consult.log/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('consult.log/messages')?'':'hide'}" lay-event="view"><i class="fa fa-comments"></i> 查看留言</button>
    <button class="layui-btn layui-bg-orange btn-disabled disabled {:$auth->check('consult.log/close')?'':'hide'}" lay-event="close"><i class="fa fa-lock"></i> 关闭会话</button>
</script>

<script>
    layui.use(["badou", "table", "laypage"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var layer = layui.layer;
        var $ = layui.jquery;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "consult.log/index" + location.search,
                del_url: "consult.log/del",
                table: "app_conversation",
            },
        });

        bdTable.api.events.operate['view-consult'] = function (id, obj) {
            openMessages(obj.data.id);
            return false;
        };

        var tableObj = bdTable.render({
            elem: "#consultlog",
            url: "{:url('consult.log/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 70, sort: true },
                    { field: "initiator.nickname", title: "发起人", operate: false },
                    { field: "initiator_id", title: "发起人ID", operate: "BETWEEN", sortable: true, hide: true },
                    { field: "type", title: "类型", searchList: { consult: "留言咨询" } },
                    { field: "target_type", title: "咨询对象", searchList: { project: "项目", user: "用户" } },
                    { field: "target_id", title: "对象ID", operate: "BETWEEN", sortable: true },
                    { field: "subject", title: "主题", operate: "LIKE" },
                    { field: "status", title: "状态", searchList: { open: "进行中", closed: "已关闭" }, custom: { open: "green", closed: "default" }, templet: bdTable.api.formatter.status },
                    { field: "last_message_at", title: "最后留言", templet: bdTable.api.formatter.datetime, operate: false },
                    { field: "create_time", title: "创建时间", templet: bdTable.api.formatter.datetime, operate: false },
                    { title: "操作", field: "operate", width: 170, fixed: "right", align: "center",
                        templet: bdTable.api.formatter.operate,
                        buttons: [{name: 'messages', text: '查看', icon: 'fa fa-eye',
                            classname: 'layui-btn layui-btn-xs layui-btn-primary',
                            extend: 'lay-event="view-consult"'},
                            $.extend({}, bdTable.button.del, {text: '删除', classname: 'layui-btn layui-btn-xs layui-bg-red'})]
                    },
                ],
            ],
        });

        function openMessages(id) {
            // Layer 的 DOM 弹窗会就地包装内容节点，必须先挂载到页面。
            var content = $('<div>').css('padding', '14px 18px').appendTo('body');
            var subject = $('<div>').css('margin-bottom', '12px').appendTo(content);
            var list = $('<div>').css({maxHeight: '55vh', overflow: 'auto'}).appendTo(content);
            var pager = $('<div>').appendTo(content);
            layer.open({type: 1, title: '会话 #' + id + ' 留言记录', area: ['720px', 'auto'], content: content,
                end: function () { content.remove(); }
            });
            function loadPage(page) {
                layui.badou.api.ajax({
                    url: "{:url('consult.log/messages')}", type: 'GET',
                    data: {conversation_id: id, page: page, limit: 50}
                }, function (data) {
                    subject.text(data.conversation.subject || '未填写主题');
                    list.empty();
                    if (!data.list.length) {
                        $('<div>').text('暂无留言').appendTo(list);
                    }
                    data.list.forEach(function (message) {
                        var item = $('<div>').css('margin-bottom', '12px').appendTo(list);
                        $('<b>').text(message.nickname || '用户#' + message.sender_id).appendTo(item);
                        $('<span>').css({color: '#a2a8b4', marginLeft: '8px'}).text(
                            message.create_time ? layui.util.toDateString(message.create_time * 1000) : '-'
                        ).appendTo(item);
                        $('<div>').css({marginTop: '4px', whiteSpace: 'pre-wrap', overflowWrap: 'anywhere'})
                            .text(message.body || '').appendTo(item);
                    });
                    layui.laypage.render({elem: pager[0], count: data.total, curr: data.page, limit: data.limit,
                        jump: function (pageInfo, first) { if (!first) loadPage(pageInfo.curr); }
                    });
                    return false;
                });
            }
            loadPage(1);
        }

        table.on("toolbar(consultlog)", function (obj) {
            var event = obj.event;
            if (event === "refresh") { tableObj.reload(); return; }

            var rows = table.checkStatus("consultlog").data;
            if (!rows.length) { layer.msg("请先选择会话"); return; }

            if (event === "view") {
                var id = rows[0].id;
                openMessages(id);
                return;
            }

            if (event === "close") {
                var ids = rows.map(function (r) { return r.id; }).join(",");
                layer.confirm("确认关闭所选会话？", function (index) {
                    $.post("{:url('consult.log/close')}", { ids: ids }, function (ret) {
                        layer.close(index);
                        layer.msg(ret.msg || "操作完成");
                        if (ret.code === 1) { tableObj.reload(); }
                    });
                });
            }
        });
    });
</script>
