{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="general_pageimages" data-operate-edit="{:$auth->check('general.pageimages/edit')}" data-operate-del="{:$auth->check('general.pageimages/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('general.pageimages/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('general.pageimages/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('general.pageimages/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
    
</script>

<script>
layui.use(["badou", "table"], function () {
    var bdTable = layui.bdTable;
    var table = layui.table;
    bdTable.api.init({
        table: table,
        extend: {
            index_url: "general.pageimages/index",
            add_url: "general.pageimages/add",
            edit_url: "general.pageimages/edit",
            del_url: "general.pageimages/del",
            multi_url: "general.pageimages/multi",
            table: "page_images",
        },
    });
    bdTable.render({
        elem: "#general_pageimages",
        url: "{:url('general.pageimages/index')}",
        pk: "id",
        sortName: "weigh",
        even: true,
        toolbar: "#toolbar",
        cols: [[
                    { type: "checkbox" },
                    { field: "id", title: __('Id'), width: 80, sort: true },
                    { field: "page", title: __('Page'), operate: 'LIKE' },
                    { field: "lang", title: __('Lang'), operate: 'LIKE' },
                    { field: 'url', title: __('Url'), width: 80, align: "center", templet: bdTable.api.formatter.image, operate: false },
                    { field: "weigh", title: __('Weigh') },
                    { field: "status_text", title: __('Status'), templet: bdTable.api.formatter.status },
                    { field: "create_time", title: __('CreateTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { field: "update_time", title: __('UpdateTime'), searchType: 'time', templet: bdTable.api.formatter.datetime },
                    { title: __("Operate"), width: 180, templet: bdTable.api.formatter.operate }
        ]],
    });
});
</script>
