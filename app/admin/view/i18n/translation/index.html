{layout name="layout/default" /}
<div class="layui-card"><div class="layui-card-body">
    <blockquote class="layui-elem-quote">翻译任务由服务器定时执行。人工编辑后自动锁定；原文变更时旧译文不会继续用于展示，请重新修订。失败任务自动重试最多三次。批量发布请先筛选“待审核”，勾选译文后点击“审核通过”。</blockquote>
    <table class="layui-hide" id="translation" data-operate-edit="{:$auth->check('i18n.translation/edit')}"></table>
</div></div>
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button type="button" class="layui-btn layui-bg-green btn-disabled disabled {:$auth->check('i18n.translation/approve')?'':'hide'}" lay-event="approve"><i class="fa fa-check"></i> 审核通过</button>
</script>
<script>
layui.use(['badou'], function () {
    var bdTable = layui.bdTable;
    bdTable.api.init({table: layui.table, extend: {
        index_url: 'i18n.translation/index', edit_url: 'i18n.translation/edit', table: 'app_translation'
    }});
    bdTable.api.events.toolbar.approve = function (id) {
        var rows = layui.table.checkStatus(id).data;
        if (!rows.length) {
            layui.layer.msg('请先勾选待审核译文');
            return false;
        }
        if (rows.some(function (row) { return row.status !== 'review'; })) {
            layui.layer.msg('请仅选择待审核译文');
            return false;
        }
        layui.layer.confirm('确认审核通过并发布所选 ' + rows.length + ' 条译文？', function (index) {
            layui.layer.close(index);
            layui.badou.api.ajax({
                url: "{:url('i18n.translation/approve')}", type: 'POST',
                data: {ids: rows.map(function (row) { return row.id; }).join(',')}
            }, function () {
                bdTable.api.events.toolbar.refresh(id);
            });
        });
        return false;
    };
    bdTable.render({elem: '#translation', url: "{:url('i18n.translation/index')}", pk: 'id', toolbar: '#toolbar',
        page: true,
        limit: 20,
        limits: [20, 50, 100],
        cols: [[
        {type: 'checkbox', fixed: 'left'},
        {field: 'id', title: 'ID', width: 80, sort: true},
        {field: 'resource_type', title: '资源', searchList: {api_message:'API 提示',project:'项目',content:'资讯',category:'分类',plan:'套餐',promotion_package:'推广包',timeline:'里程碑',material:'资料'}},
        {field: 'resource_id', title: '记录 ID', width: 100},
        {field: 'field', title: '字段', width: 100},
        {field: 'locale', title: '目标语言', width: 110},
        {field: 'source_text', title: '原文', minWidth: 160, operate: 'LIKE', escape: true},
        {field: 'translated_text', title: '译文', minWidth: 160, operate: 'LIKE', escape: true},
        {field: 'origin', title: '来源', searchList: {machine:'机器',manual:'人工锁定'}},
        {field: 'status', title: '状态', searchList: {pending:'待处理',processing:'处理中',review:'待审核',published:'已发布',failed:'失败',stale:'原文已变更'}},
        {field: 'attempts', title: '尝试次数', width: 100},
        {field: 'error', title: '失败原因', minWidth: 160, escape: true},
        {title: '操作', templet: bdTable.api.formatter.operate, width: 90}
    ]]});
});
</script>
