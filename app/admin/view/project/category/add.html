{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">上级分类</label>
        <div class="layui-input-block">
            <select name="row[pid]">
                <option value="0">顶级分类 (一级)</option>
                {foreach $parentList as $parent}
                <option value="{$parent.id}">├─ {$parent.name}</option>
                {/foreach}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">分类名称</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" placeholder="例如：去中心化金融 (DeFi)" autocomplete="off" class="layui-input" lay-verify="required" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">标识 (Slug)</label>
        <div class="layui-input-block">
            <input type="text" name="row[slug]" placeholder="例如：defi" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">图标或 Emoji</label>
        <div class="layui-input-block">
            <input type="text" name="row[icon]" placeholder="例如：💰 或 fa-coins" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">赛道简介</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="分类描述与赛道定义" class="layui-textarea"></textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序权重</label>
        <div class="layui-input-block">
            <input type="number" name="row[weigh]" value="50" placeholder="数值越大越靠前" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="正常" checked />
            <input type="radio" name="row[status]" value="hidden" title="停用" />
        </div>
    </div>

    <div class="layui-form-item text-center">
        <button type="submit" class="layui-btn layui-btn-normal" lay-submit>立即提交</button>
        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
</form>
