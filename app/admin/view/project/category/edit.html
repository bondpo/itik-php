{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">上级分类</label>
        <div class="layui-input-block">
            <select name="row[pid]">
                <option value="0" {if $row.pid == 0}selected{/if}>顶级分类 (一级)</option>
                {foreach $parentList as $parent}
                {if $parent.id != $row.id}
                <option value="{$parent.id}" {if $row.pid == $parent.id}selected{/if}>├─ {$parent.name}</option>
                {/if}
                {/foreach}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">分类名称</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="{$row.name|default=''}" placeholder="例如：去中心化金融 (DeFi)" autocomplete="off" class="layui-input" lay-verify="required" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">标识 (Slug)</label>
        <div class="layui-input-block">
            <input type="text" name="row[slug]" value="{$row.slug|default=''}" placeholder="例如：defi" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">图标或 Emoji</label>
        <div class="layui-input-block">
            <input type="text" name="row[icon]" value="{$row.icon|default=''}" placeholder="例如：💰 或 fa-coins" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">赛道简介</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="分类描述与赛道定义" class="layui-textarea">{$row.description|default=''}</textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序权重</label>
        <div class="layui-input-block">
            <input type="number" name="row[weigh]" value="{$row.weigh|default=50}" placeholder="数值越大越靠前" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="正常" {if $row.status == 'normal'}checked{/if} />
            <input type="radio" name="row[status]" value="hidden" title="停用" {if $row.status == 'hidden'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <button type="submit" class="layui-btn btn-theme-color" lay-submit>立即保存</button>
        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
</form>

<script>
layui.use(['badou'], function () {
    layui.bdForm.api.bindevent($('form.layui-form'));
});
</script>
