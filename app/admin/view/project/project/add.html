{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">项目方用户 ID</label>
        <div class="layui-input-block">
            <input type="number" name="row[owner_user_id]" value="0" placeholder="项目方用户 ID" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="" placeholder="名称" autocomplete="off" class="layui-input" lay-verify="required" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">副标题</label>
        <div class="layui-input-block">
            <input type="text" name="row[subtitle]" value="" placeholder="副标题" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">封面</label>
        <div class="layui-input-block">
            <input type="text" name="row[cover]" value="" placeholder="封面" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">所属项目分类</label>
        <div class="layui-input-block">
            <select name="row[category_id]">
                <option value="0">请选择项目分类 (可选)</option>
                {foreach $categoryTree as $cat}
                <option value="{$cat.id}">{$cat.icon|default=''} {$cat.name}</option>
                {if !empty($cat.children)}
                    {foreach $cat.children as $sub}
                    <option value="{$sub.id}">&nbsp;&nbsp;&nbsp;&nbsp;├─ {$sub.icon|default=''} {$sub.name}</option>
                    {/foreach}
                {/if}
                {/foreach}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">一级分类 (文本冗余)</label>
        <div class="layui-input-block">
            <input type="text" name="row[category_l1]" value="" placeholder="一级分类" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">二级分类 (文本冗余)</label>
        <div class="layui-input-block">
            <input type="text" name="row[category_l2]" value="" placeholder="二级分类" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">国家/地区</label>
        <div class="layui-input-block">
            <input type="text" name="row[region]" value="" placeholder="国家/地区" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">标签</label>
        <div class="layui-input-block">
            <input type="text" name="row[tags]" value="" placeholder="标签" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">摘要</label>
        <div class="layui-input-block">
            <textarea name="row[summary]" placeholder="摘要" class="layui-textarea"></textarea>
        </div>
    </div>

    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">正文</label>
        <div class="layui-input-block">
            <textarea name="row[content]" placeholder="正文" class="layui-textarea"></textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <select name="row[status]">
                <option value="normal">正常</option>
                <option value="hidden">隐藏</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">认证状态</label>
        <div class="layui-input-block">
            <select name="row[verify_status]">
                <option value="none">未认证</option>
                <option value="pending">认证中</option>
                <option value="passed">已认证</option>
                <option value="rejected">未通过</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">是否认证</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[certified]" value="0" />
            <input type="checkbox" name="row[certified]" value="1" lay-skin="switch" lay-text="是|否" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">风险等级</label>
        <div class="layui-input-block">
            <select name="row[risk_level]">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">SEO 标题</label>
        <div class="layui-input-block">
            <input type="text" name="row[seo_title]" value="" placeholder="SEO 标题" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">SEO 关键词</label>
        <div class="layui-input-block">
            <input type="text" name="row[seo_keywords]" value="" placeholder="SEO 关键词" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">SEO 描述</label>
        <div class="layui-input-block">
            <input type="text" name="row[seo_description]" value="" placeholder="SEO 描述" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序权重</label>
        <div class="layui-input-block">
            <input type="number" name="row[sort_weight]" value="0" placeholder="排序权重" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">浏览量</label>
        <div class="layui-input-block">
            <input type="number" name="row[views]" value="0" placeholder="浏览量" autocomplete="off" class="layui-input" readonly />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">关注数</label>
        <div class="layui-input-block">
            <input type="number" name="row[follows]" value="0" placeholder="关注数" autocomplete="off" class="layui-input" readonly />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["form", "badou"], function () {
        layui.bdForm.api.bindevent($("form.layui-form"));
    });
</script>
