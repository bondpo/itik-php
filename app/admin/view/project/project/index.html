{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="project" data-operate-edit="{:$auth->check('project.project/edit')}" data-operate-del="{:$auth->check('project.project/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('project.project/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('project.project/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('project.project/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "project.project/index" + location.search,
                add_url: "project.project/add",
                edit_url: "project.project/edit",
                del_url: "project.project/del",
                multi_url: "project.project/multi",
                table: "app_project",
            },
        });

        bdTable.render({
            elem: "#project",
            url: "{:url('project.project/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 70, sort: true },
{ field: "name", title: "项目名称", operate: 'LIKE' },
                    { field: "owner.nickname", title: "项目方", operate: false },
{ field: "category_l1", title: "一级栏目", operate: 'LIKE' },
{ field: "category_l2", title: "二级栏目", operate: 'LIKE' },
{ field: "category_l3", title: "三级栏目", operate: 'LIKE' },
{ field: "status", title: "状态", searchList: { draft: '草稿', pending: '待审核', normal: '已通过', rejected: '已驳回', hidden: '已下架', offline: '已下线' }, custom: { draft: 'default', pending: 'orange', normal: 'green', rejected: 'red', hidden: 'default', offline: 'default' }, templet: bdTable.api.formatter.status },
{ field: "verify_status", title: "认证状态", searchList: { none: '未认证', pending: '认证中', normal: '已认证', rejected: '认证驳回' }, custom: { none: 'default', pending: 'orange', normal: 'green', rejected: 'red' }, templet: bdTable.api.formatter.status },
                    { field: "certified", title: "认证标识", searchList: { 1: "已认证", 0: "未认证" }, templet: function (d) { return d.certified == 1 ? "<span class=\"layui-badge layui-bg-green\">已认证</span>" : "<span class=\"layui-badge layui-bg-gray\">未认证</span>"; }, operate: false },
{ field: "views", title: "浏览", operate: 'BETWEEN', sortable: true },
{ field: "create_time_text", title: "提交时间", templet: bdTable.api.formatter.datetime, operate: false },
                    { field: "create_time", title: "提交时间", templet: bdTable.api.formatter.datetime, searchType: 'time', hide: true },
                    { title: "操作", width: 200, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
