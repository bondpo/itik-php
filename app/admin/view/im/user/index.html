{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="userTable" lay-filter="userTable"></table>
    </div>
</div>

<script type="text/html" id="actionTpl">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="devices">
        <i class="fa fa-laptop"></i> 在线设备
    </a>
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="resetpwd">
        <i class="fa fa-key"></i> 改密
    </a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="toggle">
        <i class="fa fa-ban"></i> 冻结/解封
    </a>
</script>

<script>
    layui.use(['badou', 'layer', 'table'], function () {
        var bdTable = layui.bdTable;
        var layer = layui.layer;
        var table = layui.table;
        var $ = layui.$;

        bdTable.api.init({
            table: table
        });

        bdTable.render({
            elem: '#userTable',
            url: '{:url("im.user/index")}',
            page: true,
            cols: [[
                { field: 'user_id', title: '系统 UID', width: 90, sort: true },
                { field: 'username', title: '登录账号', minWidth: 120 },
                { field: 'nickname', title: '用户昵称', minWidth: 130 },
                {
                    field: 'matrix_user_id', title: 'Matrix 专属账号', minWidth: 220, templet: function (d) {
                        return '<span style="font-family:monospace;color:#1e9fff;">' + d.matrix_user_id + '</span>';
                    }
                },
                { field: 'email', title: '邮箱', minWidth: 160 },
                { field: 'mobile', title: '手机号', minWidth: 130 },
                { field: 'create_time', title: '绑定时间', width: 165, templet: bdTable.api.formatter.datetime },
                { title: '操作', width: 260, align: 'center', fixed: 'right', toolbar: '#actionTpl' }
            ]]
        });

        table.on('tool(userTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'devices') {
                var loadIndex = layer.load(2);
                $.get('{:url("im.user/devices")}', { user_id: data.user_id }, function (res) {
                    layer.close(loadIndex);
                    if (res.code === 1) {
                        var devices = res.data.devices || [];
                        var dHtml = '<div style="padding:15px;">';
                        dHtml += '<div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">' +
                            '<span>当前在线设备数: <strong>' + devices.length + '</strong></span>' +
                            (devices.length > 0 ? '<button class="layui-btn layui-btn-xs layui-btn-danger btn-kill-all" data-uid="' + data.user_id + '">一键清退全部设备</button>' : '') +
                            '</div>';
                        if (devices.length === 0) {
                            dHtml += '<div style="text-align:center;padding:30px;color:#999;">该用户目前无活跃设备会话</div>';
                        } else {
                            devices.forEach(function (dev) {
                                dHtml += '<div style="border:1px solid #eee;border-radius:6px;padding:12px;margin-bottom:10px;background:#fafafa;">' +
                                    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                                    '<div><strong>' + (dev.display_name || 'Web / 移动端设备') + '</strong>' +
                                    '<div style="font-size:12px;color:#888;margin-top:4px;">设备ID: <code>' + dev.device_id + '</code></div>' +
                                    '<div style="font-size:12px;color:#888;">最近活跃 IP: ' + (dev.last_seen_ip || '未知') + '</div>' +
                                    '</div>' +
                                    '<button class="layui-btn layui-btn-xs layui-btn-danger btn-kill-one" data-uid="' + data.user_id + '" data-device="' + dev.device_id + '">踢下线</button>' +
                                    '</div></div>';
                            });
                        }
                        dHtml += '</div>';

                        var devModal = layer.open({
                            type: 1,
                            title: '在线设备管理 - ' + data.username,
                            area: ['560px', '450px'],
                            content: dHtml,
                            shadeClose: true,
                            success: function (layero) {
                                layero.find('.btn-kill-one').on('click', function () {
                                    var uid = $(this).data('uid');
                                    var devId = $(this).data('device');
                                    $.post('{:url("im.user/revokeDevice")}', { user_id: uid, device_id: devId }, function (kRes) {
                                        layer.msg(kRes.msg, { icon: kRes.code === 1 ? 1 : 2 });
                                        if (kRes.code === 1) layer.close(devModal);
                                    });
                                });
                                layero.find('.btn-kill-all').on('click', function () {
                                    var uid = $(this).data('uid');
                                    $.post('{:url("im.user/revokeAllDevices")}', { user_id: uid }, function (kRes) {
                                        layer.msg(kRes.msg, { icon: kRes.code === 1 ? 1 : 2 });
                                        if (kRes.code === 1) layer.close(devModal);
                                    });
                                });
                            }
                        });
                    } else {
                        layer.msg(res.msg, { icon: 2 });
                    }
                });
            } else if (obj.event === 'resetpwd') {
                layer.prompt({ title: '请输入为该用户设置的 Matrix 新密码 (至少6位)', formType: 1 }, function (pass, pIndex) {
                    layer.close(pIndex);
                    var loadIndex = layer.load(2);
                    $.post('{:url("im.user/resetPassword")}', { user_id: data.user_id, new_password: pass }, function (rRes) {
                        layer.close(loadIndex);
                        layer.msg(rRes.msg, { icon: rRes.code === 1 ? 1 : 2 });
                    });
                });
            } else if (obj.event === 'toggle') {
                layer.confirm('请选择对该 Matrix 账号的操作：', {
                    title: '账号状态管理',
                    btn: ['冻结并踢下线', '解除冻结', '取消']
                }, function (index) {
                    layer.close(index);
                    $.post('{:url("im.user/toggleStatus")}', { user_id: data.user_id, status: 'deactivate' }, function (res) {
                        layer.msg(res.msg, { icon: res.code === 1 ? 1 : 2 });
                    });
                }, function (index) {
                    layer.close(index);
                    $.post('{:url("im.user/toggleStatus")}', { user_id: data.user_id, status: 'reactivate' }, function (res) {
                        layer.msg(res.msg, { icon: res.code === 1 ? 1 : 2 });
                    });
                });
            }
        });
    });
</script>
