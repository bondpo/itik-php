{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="broadcastTable" lay-filter="broadcastTable"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="{:url('im.broadcast/send')}" class="layui-btn layui-bg-green">
        <i class="fa fa-plus"></i> 新建广播推送
    </a>
    <button class="layui-btn layui-bg-blue" lay-event="refresh">
        <i class="fa fa-refresh"></i> 刷新列表
    </button>
</script>

<script>
layui.use(['badou', 'layer', 'table'], function () {
    var bdTable = layui.bdTable;
    var layer = layui.layer;
    var table = layui.table;

    bdTable.api.init({
        table: table
    });

    bdTable.render({
        elem: '#broadcastTable',
        id: 'broadcastTable',
        url: '{:url("im.broadcast/index")}',
        toolbar: '#toolbar',
        page: true,
        cols: [[
            { field: 'id', title: 'ID', width: 70, sort: true },
            { field: 'title', title: '广播标题', minWidth: 160 },
            { field: 'msg_type', title: '形态', width: 100, templet: function(d) {
                if (d.msg_type === 'card') return '<span class="layui-badge layui-bg-purple">业务卡片</span>';
                if (d.msg_type === 'html') return '<span class="layui-badge layui-bg-blue">富文本</span>';
                return '<span class="layui-badge layui-bg-gray">纯文本</span>';
            }},
            { field: 'target_type', title: '目标类型', width: 110, templet: function(d) {
                if (d.target_type === 'all') return '<span class="layui-badge layui-bg-green">全员私信</span>';
                if (d.target_type === 'user') return '<span class="layui-badge layui-bg-cyan">指定用户</span>';
                return '<span class="layui-badge layui-bg-orange">指定群聊</span>';
            }},
            { field: 'target_id', title: '目标详情', width: 180, templet: function(d) {
                return '<span style="font-size:12px;color:#666;" title="' + (d.target_id || '') + '">' + (d.target_id || '-') + '</span>';
            }},
            { field: 'content', title: '正文/载荷', minWidth: 220 },
            { field: 'sent_count', title: '成功投递数', width: 110, align: 'center', templet: function(d) {
                if (d.sent_count > 0) {
                    return '<span style="color:#52c41a;font-weight:bold;">' + d.sent_count + '</span>';
                }
                return '<span style="color:#ff4d4f;font-weight:bold;">0</span>';
            }},
            { field: 'create_time', title: '发布时间', width: 165, templet: bdTable.api.formatter.datetime }
        ]]
    });

    table.on('toolbar(broadcastTable)', function(obj) {
        if (obj.event === 'refresh') {
            table.reload('broadcastTable');
            layer.msg('已刷新列表', {icon: 1, time: 800});
        }
    });
});
</script>
