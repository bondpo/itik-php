{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="rule" data-operate-edit="{:$auth->check('risk.rule/edit')}" data-operate-del="{:$auth->check('risk.rule/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('risk.rule/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('risk.rule/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('risk.rule/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "risk.rule/index" + location.search,
                add_url: "risk.rule/add",
                edit_url: "risk.rule/edit",
                del_url: "risk.rule/del",
                multi_url: "risk.rule/multi",
                table: "app_risk_rule",
            },
        });

        bdTable.render({
            elem: "#rule",
            url: "{:url('risk.rule/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 70, sort: true },
{ field: "scene", title: "场景", operate: 'LIKE' },
{ field: "rule_type", title: "规则类型", searchList: { freq: '频控', device: '设备', ip: 'IP' } },
{ field: "threshold", title: "阈值", operate: 'BETWEEN', sortable: true },
{ field: "window_sec", title: "窗口(秒)", operate: 'BETWEEN', sortable: true },
{ field: "action", title: "动作", searchList: { limit: '限流', ban: '封禁', captcha: '验证码', review: '转人工' } },
{ field: "remark", title: "备注", operate: 'LIKE' },
{ field: "status", title: "状态", searchList: { normal: '正常', hidden: '隐藏' }, custom: { normal: 'green', hidden: 'orange' }, templet: bdTable.api.formatter.status },
{ field: "create_time_text", title: "创建时间", templet: bdTable.api.formatter.datetime, operate: false },
                    { field: "create_time", title: "创建时间", templet: bdTable.api.formatter.datetime, searchType: 'time', hide: true },
                    { title: "操作", width: 130, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
