{layout name="layout/default" /}

<!-- 表格（推荐日志，只读） -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="reclog"></table>
    </div>
</div>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "recommend.log/index" + location.search,
                table: "app_recommendation",
            },
        });

        bdTable.render({
            elem: "#reclog",
            url: "{:url('recommend.log/index')}",
            pk: "id",
            even: true,
            page: true,
            cols: [
                [
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "receiver.nickname", title: "接收人", operate: false },
                    { field: "receiver_id", title: "接收人ID", operate: "BETWEEN", sortable: true, hide: true },
                    { field: "channel", title: "渠道", searchList: { owner_match: "项目方适配人脉", leader_member: "社区长每日会员" } },
                    { field: "target_type", title: "目标类型", searchList: { user: "用户", project: "项目" } },
                    { field: "target_id", title: "目标ID", operate: "BETWEEN", sortable: true },
                    { field: "score", title: "匹配分", operate: "BETWEEN", sortable: true },
                    { field: "reason", title: "推荐理由", operate: "LIKE" },
                    { field: "batch_date", title: "批次日期", searchType: "date" },
                    { field: "is_viewed", title: "已查看", searchList: { 1: "是", 0: "否" }, templet: function (d) { return d.is_viewed == 1 ? '<span class="layui-badge layui-bg-green">是</span>' : '<span class="layui-badge layui-bg-gray">否</span>'; }, operate: false },
                    { field: "is_responded", title: "已响应", searchList: { 1: "是", 0: "否" }, templet: function (d) { return d.is_responded == 1 ? '<span class="layui-badge layui-bg-blue">是</span>' : '<span class="layui-badge layui-bg-gray">否</span>'; }, operate: false },
                    { field: "feedback", title: "反馈", searchList: { relevant: "相关", irrelevant: "不相关" } },
                    { field: "create_time", title: "生成时间", templet: bdTable.api.formatter.datetime, operate: false },
                ],
            ],
        });
    });
</script>
