{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="{$row.name|default=''}" placeholder="名称" autocomplete="off" class="layui-input" lay-verify="required" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">广告位</label>
        <div class="layui-input-block">
            <select name="row[position]">
                <option value="home_banner" {:$row.position=='home_banner'?'selected':''} >首页 Banner</option>
                <option value="list_top" {:$row.position=='list_top'?'selected':''} >列表置顶</option>
                <option value="detail_side" {:$row.position=='detail_side'?'selected':''} >详情侧栏</option>
                <option value="search_top" {:$row.position=='search_top'?'selected':''} >搜索置顶</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">价格</label>
        <div class="layui-input-block">
            <input type="number" name="row[price]" value="{$row.price|default=0}" placeholder="价格" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">币种</label>
        <div class="layui-input-block">
            <input type="text" name="row[currency]" value="{$row.currency|default=''}" placeholder="币种" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">有效天数</label>
        <div class="layui-input-block">
            <input type="number" name="row[duration_days]" value="{$row.duration_days|default=0}" placeholder="有效天数" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">曝光上限</label>
        <div class="layui-input-block">
            <input type="number" name="row[exposure_cap]" value="{$row.exposure_cap|default=0}" placeholder="曝光上限" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">权益配置(JSON)</label>
        <div class="layui-input-block">
            <textarea name="row[feature_flags]" placeholder="权益配置(JSON)" class="layui-textarea">{$row.feature_flags|default=''}</textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <select name="row[status]">
                <option value="normal" {:$row.status=='normal'?'selected':''} >正常</option>
                <option value="hidden" {:$row.status=='hidden'?'selected':''} >隐藏</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["form", "badou"], function () {
        layui.bdForm.api.bindevent($("form.layui-form"));
    });
</script>
