{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="plan" data-operate-edit="{:$auth->check('billing.plan/edit')}" data-operate-del="{:$auth->check('billing.plan/del')}"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black"><i class="fa fa-refresh"></i></a>
    <button class="layui-btn layui-bg-green {:$auth->check('billing.plan/add')?'':'hide'}" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('billing.plan/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('billing.plan/del')?'':'hide'}" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "billing.plan/index" + location.search,
                add_url: "billing.plan/add",
                edit_url: "billing.plan/edit",
                del_url: "billing.plan/del",
                multi_url: "billing.plan/multi",
                table: "app_plan",
            },
        });

        bdTable.render({
            elem: "#plan",
            url: "{:url('billing.plan/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 70, sort: true },
{ field: "plan_code", title: "套餐代码", operate: 'LIKE' },
{ field: "name", title: "套餐名称", operate: 'LIKE' },
{ field: "role_code", title: "对应角色", searchList: { OWNER: '项目方', LEADER: '社区长', MEMBER: '会员' } },
{ field: "price", title: "价格", operate: 'BETWEEN', sortable: true },
{ field: "currency", title: "币种" },
{ field: "duration_days", title: "时长(天)", operate: 'BETWEEN', sortable: true },
{ field: "weigh", title: "权重", operate: 'BETWEEN', sortable: true },
{ field: "status", title: "状态", searchList: { normal: '正常', hidden: '隐藏' }, custom: { normal: 'green', hidden: 'orange' }, templet: bdTable.api.formatter.status },
{ field: "create_time_text", title: "创建时间", templet: bdTable.api.formatter.datetime, operate: false },
                    { field: "create_time", title: "创建时间", templet: bdTable.api.formatter.datetime, searchType: 'time', hide: true },
                    { title: "操作", width: 130, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
