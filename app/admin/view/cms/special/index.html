{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="special"
            data-operate-edit="{:$auth->check('cms.special/edit')}"
            data-operate-del="{:$auth->check('cms.special/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.special/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.special/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.special/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<!-- 表格自定义适配样式：防止表头标题换行挤压、与排序图标重叠 -->
<style>
    .layui-table th {
        white-space: nowrap !important;
    }
    .layui-table-cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.special/index" + location.search,
                add_url: "cms.special/add",
                edit_url: "cms.special/edit",
                del_url: "cms.special/del",
                multi_url: "cms.special/multi",
                table: "cms_special",
            },
        });
        bdTable.render({
            elem: "#special",
            url: "{:url('cms.special/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cellMinWidth: 100,
            cols: [
                [
                    { type: "checkbox", width: 50, fixed: "left" },
                    { field: "id", title: "ID", width: 70, sort: true, fixed: "left" },
                    { field: "title", title: "{:__('Title')}", minWidth: 180, operate: 'LIKE' },
                    { field: "admin_id", title: "{:__('Admin_id')}", width: 80, align: "center", operate: '=' },
                    { field: "label", title: "{:__('Label')}", minWidth: 100, operate: 'LIKE' },
                    { field: "tag_ids", title: "{:__('Tag_ids')}", minWidth: 100, operate: 'LIKE' },
                    { field: "flag", title: "{:__('Flag')}", minWidth: 90, operate: 'LIKE' },
                    { field: "image", title: "{:__('Image')}", width: 80, align: "center", templet: bdTable.api.formatter.image, operate: false },
                    { field: "banner", title: "{:__('Banner')}", width: 80, align: "center", templet: bdTable.api.formatter.image, operate: false },
                    { field: "diyname", title: "{:__('Diyname')}", minWidth: 120, operate: 'LIKE' },
                    { field: "views", title: "{:__('Views')}", width: 80, align: "center", operate: 'BETWEEN', sortable: true },
                    { field: "comments", title: "{:__('Comments')}", width: 80, align: "center", operate: 'BETWEEN', sortable: true },
                    { field: "template", title: "{:__('Template')}", minWidth: 120, operate: 'LIKE' },
                    { field: "seotitle", title: "{:__('Seotitle')}", minWidth: 150, operate: 'LIKE' },
                    { field: "keywords", title: "{:__('Keywords')}", minWidth: 130, operate: 'LIKE' },
                    { field: "description", title: "{:__('Description')}", minWidth: 160, operate: 'LIKE' },
                    { field: "intro", title: "{:__('Intro')}", minWidth: 150, operate: 'LIKE' },
                    { field: "iscomment", title: "{:__('Iscomment')}", hide: true, operate: false },
                    { field: "status", title: "{:__('Status')}", width: 90, align: "center", searchList: {"normal": "normal", "hidden": "hidden"}, custom: { normal: "green", hidden: "orange" }, templet: bdTable.api.formatter.status },
                    { field: "createtime", title: "{:__('Createtime')}", width: 165, templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", fixed: "right", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
