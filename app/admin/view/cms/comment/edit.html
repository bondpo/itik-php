{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('User_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[user_id]" value="{$row.user_id|default=''}" placeholder="{:__('User_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Type')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[type]" value="archives" title="archives" {if $row.type=='archives'}checked{/if} />
            <input type="radio" name="row[type]" value="page" title="page" {if $row.type=='page'}checked{/if} />
            <input type="radio" name="row[type]" value="special" title="special" {if $row.type=='special'}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Aid')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[aid]" value="{$row.aid|default=''}" placeholder="{:__('Aid')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Pid')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[pid]" value="{$row.pid|default=''}" placeholder="{:__('Pid')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Content')}</label>
        <div class="layui-input-block">
            <textarea name="row[content]" placeholder="{:__('Content')}" class="layui-textarea">{$row.content|default=''}</textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Comments')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[comments]" value="{$row.comments|default=''}" placeholder="{:__('Comments')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Ip')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[ip]" value="{$row.ip|default=''}" placeholder="{:__('Ip')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Useragent')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[useragent]" value="{$row.useragent|default=''}" placeholder="{:__('Useragent')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Subscribe')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[subscribe]" value="0" />
            <input type="checkbox" name="row[subscribe]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.subscribe}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="normal" {if $row.status=='normal'}checked{/if} />
            <input type="radio" name="row[status]" value="hidden" title="hidden" {if $row.status=='hidden'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
