{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <div class="layui-form-item" style="margin-bottom:0;">
            <label class="layui-form-label">类型</label>
            <div class="layui-input-inline">
                <select id="page-type" lay-filter="page-type">
                    <option value="">全部</option>
                    {volist name="typeList" id="vo"}
                    <option value="{$vo}">{$vo}</option>
                    {/volist}
                </select>
            </div>
        </div>

        <table class="layui-hide" id="page-select"></table>
    </div>
</div>

<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
</script>

<script type="text/html" id="page-select-operate">
    <a class="layui-btn layui-btn-xs layui-bg-green" lay-event="choose">选择</a>
</script>

<script>
    layui.use(["badou", "table", "form"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var form = layui.form;

        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.page/select" + location.search,
                table: "cms_page",
            },
        });

        bdTable.render({
            elem: "#page-select",
            url: "{:url('cms.page/select')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "type", title: "{:__('Type')}", width: 120 },
                    { field: "title", title: "{:__('Title')}", minWidth: 200, operate: "LIKE" },
                    { field: "diyname", title: "{:__('Diyname')}", width: 140 },
                    { field: "createtime", title: "{:__('Createtime')}", width: 170, templet: bdTable.api.formatter.datetime },
                    { title: "{:__('Operate')}", width: 100, align: "center", templet: "#page-select-operate" },
                ],
            ],
        });

        // 选择数据行，回填到父页面（父页面提供 callback 或表单字段）
        table.on("tool(page-select)", function (obj) {
            if (obj.event !== "choose") {
                return;
            }
            var data = obj.data;
            if (window.name && parent.window) {
                var cb = parent.window.bdPageSelectCallback;
                if (typeof cb === "function") {
                    cb(data);
                } else if (parent.$ && parent.$(parent.document).data("page-select-input")) {
                    parent.$("#" + parent.$(parent.document).data("page-select-input")).val(data.id);
                }
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            }
        });

        form.on("select(page-type)", function (data) {
            table.reload("page-select", { where: { type: data.value }, page: { curr: 1 } });
        });
    });
</script>
