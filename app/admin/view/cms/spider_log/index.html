{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="spider_log"
            data-operate-edit="{:$auth->check('cms.spider_log/edit')}"
            data-operate-del="{:$auth->check('cms.spider_log/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.spider_log/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.spider_log/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.spider_log/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.spider_log/index" + location.search,
                add_url: "cms.spider_log/add",
                edit_url: "cms.spider_log/edit",
                del_url: "cms.spider_log/del",
                multi_url: "cms.spider_log/multi",
                table: "cms_spider_log",
            },
        });
        bdTable.render({
            elem: "#spider_log",
            url: "{:url('cms.spider_log/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "type", title: "{:__('Type')}", searchList: {"index": "index", "archives": "archives", "page": "page", "special": "special", "channel": "channel", "diyform": "diyform", "tag": "tag", "user": "user"}, templet: bdTable.api.formatter.status },
                    { field: "aid", title: "{:__('Aid')}", operate: 'LIKE' },
                    { field: "name", title: "{:__('Name')}", operate: 'LIKE' },
                    { field: "url", title: "{:__('Url')}", operate: 'LIKE' },
                    { field: "nums", title: "{:__('Nums')}", operate: 'LIKE' },
                    { field: "firsttime", title: "{:__('Firsttime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { field: "lastdata", title: "{:__('Lastdata')}", operate: 'LIKE' },
                    { field: "lasttime", title: "{:__('Lasttime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { field: "createtime", title: "{:__('Createtime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
