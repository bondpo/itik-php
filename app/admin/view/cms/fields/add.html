{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <input type="hidden" name="row[source]" value="{$source|htmlentities}" />
    <input type="hidden" name="row[source_id]" value="{$source_id|default=0}" />

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="" lay-verify="required" placeholder="仅支持字母、数字、下划线" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Title')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[title]" value="" lay-verify="required" placeholder="{:__('Title')}" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Type')}</label>
        <div class="layui-input-block">
            <select name="row[type]" lay-filter="field-type">
                {volist name="typeList" id="vo" key="k"}
                <option value="{$key}">{$vo}</option>
                {/volist}
            </select>
        </div>
    </div>

    <div class="layui-form-item" data-for="options">
        <label class="layui-form-label">选项列表</label>
        <div class="layui-input-block">
            <textarea name="row[content]" placeholder='键值对 JSON，例如 {"value1":"标题1","value2":"标题2"}' class="layui-textarea"></textarea>
            <p class="text-secondary mt-2">单选/多选/下拉类型需要配置该选项列表（JSON 格式）。</p>
        </div>
    </div>

    <div class="layui-form-item" data-for="options">
        <label class="layui-form-label">默认值</label>
        <div class="layui-input-block">
            <input type="text" name="row[defaultvalue]" value="" placeholder="{:__('Defaultvalue')}" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">校验规则</label>
        <div class="layui-input-block">
            <select name="row[rule][]" multiple>
                {volist name="regexList" id="vo" key="k"}
                <option value="{$key}">{$vo}</option>
                {/volist}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">校验提示</label>
        <div class="layui-input-block">
            <input type="text" name="row[msg]" value="" placeholder="校验失败时的提示语" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">通过提示</label>
        <div class="layui-input-block">
            <input type="text" name="row[ok]" value="" placeholder="校验通过时的提示语" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">字段提示</label>
        <div class="layui-input-block">
            <input type="text" name="row[tip]" value="" placeholder="字段说明，显示在输入框下方" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item" data-for="number">
        <label class="layui-form-label">小数位</label>
        <div class="layui-input-block">
            <input type="number" name="row[decimals]" value="0" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">长度/范围</label>
        <div class="layui-input-inline">
            <input type="number" name="row[length]" value="255" placeholder="长度" class="layui-input" />
        </div>
        <div class="layui-input-inline">
            <input type="number" name="row[minimum]" value="" placeholder="最小值" class="layui-input" />
        </div>
        <div class="layui-input-inline">
            <input type="number" name="row[maximum]" value="0" placeholder="最大值" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">扩展属性</label>
        <div class="layui-input-block">
            <input type="text" name="row[extend]" value="" placeholder="附加到表单元素的 HTML 属性" autocomplete="off" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">参与排序</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[isorder]" value="0" />
            <input type="checkbox" name="row[isorder]" value="1" lay-skin="switch" lay-text="开启|关闭" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">投稿字段</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[iscontribute]" value="0" />
            <input type="checkbox" name="row[iscontribute]" value="1" lay-skin="switch" lay-text="开启|关闭" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">筛选字段</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[isfilter]" value="0" />
            <input type="checkbox" name="row[isfilter]" value="1" lay-skin="switch" lay-text="开启|关闭" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <select name="row[status]">
                {volist name="statusList" id="vo" key="k"}
                <option value="{$key}" {if $key=='normal'}selected{/if}>{$vo}</option>
                {/volist}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Weigh')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[weigh]" value="0" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou", "form"], function () {
        var $ = layui.jquery;
        var bdForm = layui.bdForm;
        var form = layui.form;

        // 按字段类型显示相关配置项
        function toggleByType(type) {
            var optionTypes = ["select", "radio", "checkbox", "selects", "array"];
            var numberTypes = ["number"];
            $('[data-for="options"]').toggle(optionTypes.indexOf(type) >= 0);
            $('[data-for="number"]').toggle(numberTypes.indexOf(type) >= 0);
        }

        form.on("select(field-type)", function (data) {
            toggleByType(data.value);
        });

        bdForm.api.bindevent($("form.layui-form"));

        // 初始化时按当前选中类型显示
        toggleByType($('select[name="row[type]"]').val());
        form.render();
    });
</script>
