{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Admin_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[admin_id]" value="{$row.admin_id|default=''}" placeholder="{:__('Admin_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="{$row.name|default=''}" placeholder="{:__('Name')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Title')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[title]" value="{$row.title|default=''}" placeholder="{:__('Title')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Seotitle')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[seotitle]" value="{$row.seotitle|default=''}" placeholder="{:__('Seotitle')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Posttitle')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[posttitle]" value="{$row.posttitle|default=''}" placeholder="{:__('Posttitle')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Keywords')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[keywords]" value="{$row.keywords|default=''}" placeholder="{:__('Keywords')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Description')}</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="{:__('Description')}" class="layui-textarea">{$row.description|default=''}</textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Table')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[table]" value="{$row.table|default=''}" placeholder="{:__('Table')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Fields')}</label>
        <div class="layui-input-block">
            <textarea name="row[fields]" placeholder="{:__('Fields')}" class="layui-textarea">{$row.fields|default=''}</textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Isguest')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[isguest]" value="0" />
            <input type="checkbox" name="row[isguest]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.isguest}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Needlogin')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[needlogin]" value="0" />
            <input type="checkbox" name="row[needlogin]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.needlogin}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Isedit')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[isedit]" value="0" />
            <input type="checkbox" name="row[isedit]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.isedit}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Iscaptcha')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[iscaptcha]" value="0" />
            <input type="checkbox" name="row[iscaptcha]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.iscaptcha}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Successtips')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[successtips]" value="{$row.successtips|default=''}" placeholder="{:__('Successtips')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Redirecturl')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[redirecturl]" value="{$row.redirecturl|default=''}" placeholder="{:__('Redirecturl')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Posttpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Listtpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Showtpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Diyname')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[diyname]" value="{$row.diyname|default=''}" placeholder="{:__('Diyname')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Usermode')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[usermode]" value="all" title="all" {if $row.usermode=='all'}checked{/if} />
            <input type="radio" name="row[usermode]" value="user" title="user" {if $row.usermode=='user'}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Statusmode')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[statusmode]" value="all" title="all" {if $row.statusmode=='all'}checked{/if} />
            <input type="radio" name="row[statusmode]" value="normal" title="normal" {if $row.statusmode=='normal'}checked{/if} />
            <input type="radio" name="row[statusmode]" value="hidden" title="hidden" {if $row.statusmode=='hidden'}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Setting')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[setting]" value="{$row.setting|default=''}" placeholder="{:__('Setting')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="normal" {if $row.status=='normal'}checked{/if} />
            <input type="radio" name="row[status]" value="hidden" title="hidden" {if $row.status=='hidden'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
