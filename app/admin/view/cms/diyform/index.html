{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="diyform"
            data-operate-edit="{:$auth->check('cms.diyform/edit')}"
            data-operate-del="{:$auth->check('cms.diyform/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.diyform/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.diyform/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.diyform/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<!-- 表格自定义适配样式：防止表头标题换行挤压、与排序图标重叠 -->
<style>
    .layui-table th {
        white-space: nowrap !important;
    }
    .layui-table-cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.diyform/index" + location.search,
                add_url: "cms.diyform/add",
                edit_url: "cms.diyform/edit",
                del_url: "cms.diyform/del",
                multi_url: "cms.diyform/multi",
                table: "cms_diyform",
            },
        });
        bdTable.render({
            elem: "#diyform",
            url: "{:url('cms.diyform/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cellMinWidth: 100,
            cols: [
                [
                    { type: "checkbox", width: 50, fixed: "left" },
                    { field: "id", title: "ID", width: 70, sort: true, fixed: "left" },
                    { field: "title", title: "{:__('Title')}", minWidth: 160, operate: 'LIKE' },
                    { field: "name", title: "{:__('Name')}", minWidth: 120, operate: 'LIKE' },
                    { field: "table", title: "{:__('Table')}", minWidth: 120, operate: 'LIKE' },
                    { field: "admin_id", title: "{:__('Admin_id')}", width: 80, align: "center", operate: '=' },
                    { field: "diyname", title: "{:__('Diyname')}", minWidth: 120, operate: 'LIKE' },
                    { field: "usermode", title: "{:__('Usermode')}", width: 95, align: "center", searchList: {"all": "all", "user": "user"}, templet: bdTable.api.formatter.status },
                    { field: "statusmode", title: "{:__('Statusmode')}", width: 95, align: "center", searchList: {"all": "all", "normal": "normal", "hidden": "hidden"}, templet: bdTable.api.formatter.status },
                    { field: "successtips", title: "{:__('Successtips')}", minWidth: 140, operate: 'LIKE' },
                    { field: "redirecturl", title: "{:__('Redirecturl')}", minWidth: 150, operate: 'LIKE' },
                    { field: "seotitle", title: "{:__('Seotitle')}", minWidth: 140, operate: 'LIKE' },
                    { field: "posttitle", title: "{:__('Posttitle')}", minWidth: 140, operate: 'LIKE' },
                    { field: "keywords", title: "{:__('Keywords')}", minWidth: 130, operate: 'LIKE' },
                    { field: "description", title: "{:__('Description')}", minWidth: 160, operate: 'LIKE' },
                    { field: "fields", title: "{:__('Fields')}", hide: true, operate: false },
                    { field: "isguest", title: "{:__('Isguest')}", hide: true, operate: false },
                    { field: "needlogin", title: "{:__('Needlogin')}", hide: true, operate: false },
                    { field: "isedit", title: "{:__('Isedit')}", hide: true, operate: false },
                    { field: "iscaptcha", title: "{:__('Iscaptcha')}", hide: true, operate: false },
                    { field: "setting", title: "{:__('Setting')}", minWidth: 120, operate: 'LIKE' },
                    { field: "status", title: "{:__('Status')}", width: 90, align: "center", searchList: {"normal": "normal", "hidden": "hidden"}, custom: { normal: "green", hidden: "orange" }, templet: bdTable.api.formatter.status },
                    { field: "createtime", title: "{:__('Createtime')}", width: 165, templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", fixed: "right", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
