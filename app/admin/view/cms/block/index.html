{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="block"
            data-operate-edit="{:$auth->check('cms.block/edit')}"
            data-operate-del="{:$auth->check('cms.block/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.block/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.block/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.block/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.block/index" + location.search,
                add_url: "cms.block/add",
                edit_url: "cms.block/edit",
                del_url: "cms.block/del",
                multi_url: "cms.block/multi",
                table: "cms_block",
            },
        });
        bdTable.render({
            elem: "#block",
            url: "{:url('cms.block/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "type", title: "{:__('Type')}", operate: 'LIKE' },
                    { field: "name", title: "{:__('Name')}", operate: 'LIKE' },
                    { field: "title", title: "{:__('Title')}", operate: 'LIKE' },
                    { field: "lang", title: "{:__('Language')}", width: 160, searchList: Config.languageList,
                        templet: function (row) { return layui.util.escape(Config.languageList[row.lang] || row.lang || '通用（所有语言）'); }
                    },
                    { field: "image", title: "{:__('Image')}", operate: 'LIKE' },
                    { field: "url", title: "{:__('Url')}", operate: 'LIKE' },
                    { field: "content", title: "{:__('Content')}", hide: true, operate: false },
                    { field: "weigh", title: "{:__('Weigh')}", operate: 'LIKE' },
                    { field: "begintime", title: "{:__('Begintime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { field: "endtime", title: "{:__('Endtime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { field: "status", title: "{:__('Status')}", searchList: {"normal": "normal", "hidden": "hidden"}, templet: bdTable.api.formatter.status },
                    { field: "createtime", title: "{:__('Createtime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
