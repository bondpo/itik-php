{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    {if isset($row)}<input type="hidden" name="row[id]" value="{$row.id}">{/if}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input
                type="text"
                name="row[name]"
                value="{$row.name|default=''|htmlentities}"
                lay-verify="required"
                placeholder="{:__('Name')}"
                autocomplete="off"
                class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Seotitle')}</label>
        <div class="layui-input-block">
            <input
                type="text"
                name="row[seotitle]"
                value="{$row.seotitle|default=''|htmlentities}"
                placeholder="{:__('Seotitle')}"
                autocomplete="off"
                class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Keywords')}</label>
        <div class="layui-input-block">
            <input
                type="text"
                name="row[keywords]"
                value="{$row.keywords|default=''|htmlentities}"
                placeholder="{:__('Keywords')}"
                autocomplete="off"
                class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Description')}</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="{:__('Description')}" class="layui-textarea">{$row.description|default=''|htmlentities}</textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="{:__('Normal')}" {if $row.status=='normal'}checked{/if} />
            <input type="radio" name="row[status]" value="hidden" title="{:__('Hidden')}" {if $row.status=='hidden'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
