{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Orderid')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[orderid]" value="{$row.orderid|default=''}" placeholder="{:__('Orderid')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('User_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[user_id]" value="{$row.user_id|default=''}" placeholder="{:__('User_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Archives_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[archives_id]" value="{$row.archives_id|default=''}" placeholder="{:__('Archives_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Title')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[title]" value="{$row.title|default=''}" placeholder="{:__('Title')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Amount')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[amount]" value="{$row.amount|default=''}" placeholder="{:__('Amount')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Payamount')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[payamount]" value="{$row.payamount|default=''}" placeholder="{:__('Payamount')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Paytype')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[paytype]" value="{$row.paytype|default=''}" placeholder="{:__('Paytype')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Paytime')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[paytime]" value="{$row.paytime|default=''}" placeholder="{:__('Paytime')}" class="layui-input laydate" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Method')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[method]" value="{$row.method|default=''}" placeholder="{:__('Method')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Ip')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[ip]" value="{$row.ip|default=''}" placeholder="{:__('Ip')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Useragent')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[useragent]" value="{$row.useragent|default=''}" placeholder="{:__('Useragent')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Memo')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[memo]" value="{$row.memo|default=''}" placeholder="{:__('Memo')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="created" title="created" {if $row.status=='created'}checked{/if} />
            <input type="radio" name="row[status]" value="paid" title="paid" {if $row.status=='paid'}checked{/if} />
            <input type="radio" name="row[status]" value="expired" title="expired" {if $row.status=='expired'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
