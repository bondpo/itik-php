{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="order"
            data-operate-edit="{:$auth->check('cms.order/edit')}"
            data-operate-del="{:$auth->check('cms.order/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.order/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.order/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.order/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.order/index" + location.search,
                add_url: "cms.order/add",
                edit_url: "cms.order/edit",
                del_url: "cms.order/del",
                multi_url: "cms.order/multi",
                table: "cms_order",
            },
        });
        bdTable.render({
            elem: "#order",
            url: "{:url('cms.order/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "orderid", title: "{:__('Orderid')}", operate: 'LIKE' },
                    { field: "user_id", title: "{:__('User_id')}", operate: 'LIKE' },
                    { field: "archives_id", title: "{:__('Archives_id')}", operate: 'LIKE' },
                    { field: "title", title: "{:__('Title')}", operate: 'LIKE' },
                    { field: "amount", title: "{:__('Amount')}", operate: 'LIKE' },
                    { field: "payamount", title: "{:__('Payamount')}", operate: 'LIKE' },
                    { field: "paytype", title: "{:__('Paytype')}", operate: 'LIKE' },
                    { field: "paytime", title: "{:__('Paytime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { field: "method", title: "{:__('Method')}", operate: 'LIKE' },
                    { field: "ip", title: "{:__('Ip')}", operate: 'LIKE' },
                    { field: "useragent", title: "{:__('Useragent')}", operate: 'LIKE' },
                    { field: "memo", title: "{:__('Memo')}", operate: 'LIKE' },
                    { field: "status", title: "{:__('Status')}", searchList: {"created": "created", "paid": "paid", "expired": "expired"}, templet: bdTable.api.formatter.status },
                    { field: "createtime", title: "{:__('Createtime')}", templet: bdTable.api.formatter.datetime, hide: true, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
