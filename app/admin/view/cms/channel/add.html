{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Type')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[type]" value="channel" title="channel" {if $row.type=='channel'}checked{/if} />
            <input type="radio" name="row[type]" value="page" title="page" {if $row.type=='page'}checked{/if} />
            <input type="radio" name="row[type]" value="link" title="link" {if $row.type=='link'}checked{/if} />
            <input type="radio" name="row[type]" value="list" title="list" {if $row.type=='list'}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Model_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[model_id]" value="{$row.model_id|default=''}" placeholder="{:__('Model_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Parent_id')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[parent_id]" value="{$row.parent_id|default=''}" placeholder="{:__('Parent_id')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="{$row.name|default=''}" placeholder="{:__('Name')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Image')}</label>
        <div class="layui-input-block">
            <input type="text" id="c-image" name="row[image]" value="{$row.image|default=''}" placeholder="{:__('Image')}" class="layui-input" style="width:70%" />
            <div class="layui-input-suffix" style="width:30%">
                <button type="button" data-input-id="c-image" data-preview-id="p-image" class="layui-btn btn-bdupload"><i class="fa fa-upload"></i> 上传</button>
                <button type="button" data-input-id="c-image" class="layui-btn layui-bg-green btn-bdchoose"><i class="fa fa-list"></i> 选择</button>
            </div>
            <div class="layui-upload-list" id="p-image"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Flag')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[flag]" value="{$row.flag|default=''}" placeholder="{:__('Flag')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Seotitle')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[seotitle]" value="{$row.seotitle|default=''}" placeholder="{:__('Seotitle')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Keywords')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[keywords]" value="{$row.keywords|default=''}" placeholder="{:__('Keywords')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Description')}</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="{:__('Description')}" class="layui-textarea">{$row.description|default=''}</textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Diyname')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[diyname]" value="{$row.diyname|default=''}" placeholder="{:__('Diyname')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Outlink')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[outlink]" value="{$row.outlink|default=''}" placeholder="{:__('Outlink')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Linktype')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[linktype]" value="{$row.linktype|default=''}" placeholder="{:__('Linktype')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Linkid')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[linkid]" value="{$row.linkid|default=''}" placeholder="{:__('Linkid')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Items')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[items]" value="{$row.items|default=''}" placeholder="{:__('Items')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Weigh')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[weigh]" value="{$row.weigh|default=''}" placeholder="{:__('Weigh')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Channeltpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Listtpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Showtpl')}</label>
        <div class="layui-input-block">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Pagesize')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[pagesize]" value="{$row.pagesize|default=''}" placeholder="{:__('Pagesize')}" class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Vip')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[vip]" value="0" />
            <input type="checkbox" name="row[vip]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.vip}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Listtype')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[listtype]" value="0" />
            <input type="checkbox" name="row[listtype]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.listtype}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Iscontribute')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[iscontribute]" value="0" />
            <input type="checkbox" name="row[iscontribute]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.iscontribute}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Isnav')}</label>
        <div class="layui-input-block">
            <input type="hidden" name="row[isnav]" value="0" />
            <input type="checkbox" name="row[isnav]" value="1" lay-skin="switch" lay-text="开启|关闭" {if $row.isnav}checked{/if} />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="normal" {if $row.status=='normal'}checked{/if} />
            <input type="radio" name="row[status]" value="hidden" title="hidden" {if $row.status=='hidden'}checked{/if} />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
