{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Parent_id')}</label>
        <div class="layui-input-block">
            <select name="row[parent_id]" lay-search>
                <option value="0">无（顶级栏目）</option>
                {$channelOptions|raw}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Name')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="" lay-verify="required" placeholder="{:__('Name')}" class="layui-input" autocomplete="off" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Diyname')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[diyname]" value="" placeholder="自定义英文别名/标识（如 news，可选）" class="layui-input" autocomplete="off" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Image')}</label>
        <div class="layui-input-block">
            <input type="text" id="c-image" name="row[image]" value="" placeholder="{:__('Image')}" class="layui-input" style="width:70%" />
            <div class="layui-input-suffix" style="width:30%">
                <button type="button" data-input-id="c-image" data-preview-id="p-image" class="layui-btn btn-bdupload"><i class="fa fa-upload"></i> 上传</button>
                <button type="button" data-input-id="c-image" class="layui-btn layui-bg-green btn-bdchoose"><i class="fa fa-list"></i> 选择</button>
            </div>
            <div class="layui-upload-list" id="p-image"></div>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Weigh')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[weigh]" value="0" placeholder="{:__('Weigh')}" class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Seotitle')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[seotitle]" value="" placeholder="SEO 标题（为空时使用栏目名称）" class="layui-input" autocomplete="off" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Keywords')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[keywords]" value="" placeholder="SEO 关键字" class="layui-input" autocomplete="off" />
        </div>
    </div>

    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">{:__('Description')}</label>
        <div class="layui-input-block">
            <textarea name="row[description]" placeholder="SEO 描述 / 栏目简介" class="layui-textarea"></textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Status')}</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="normal" title="{:__('Normal')}" checked />
            <input type="radio" name="row[status]" value="hidden" title="{:__('Hidden')}" />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>{:__('OK')}</button>
            <button type="reset" class="layui-btn layui-btn-primary">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
