{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="channel"
            data-operate-edit="{:$auth->check('cms.channel/edit')}"
            data-operate-del="{:$auth->check('cms.channel/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('cms.channel/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.channel/edit')?'':'hide'}" lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.channel/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<!-- 表格自定义适配样式：防止表头标题换行挤压、与排序图标重叠 -->
<style>
    .layui-table th {
        white-space: nowrap !important;
    }
    .layui-table-cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.channel/index" + location.search,
                add_url: "cms.channel/add",
                edit_url: "cms.channel/edit",
                del_url: "cms.channel/del",
                multi_url: "cms.channel/multi",
                table: "cms_channel",
            },
        });
        bdTable.render({
            elem: "#channel",
            url: "{:url('cms.channel/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cellMinWidth: 100,
            cols: [
                [
                    { type: "checkbox", width: 50, fixed: "left" },
                    { field: "id", title: "ID", width: 70, sort: true, fixed: "left" },
                    { field: "name", title: "{:__('Name')}", minWidth: 180, operate: 'LIKE' },
                    { field: "diyname", title: "{:__('Diyname')}", minWidth: 130, operate: 'LIKE' },
                    { field: "image", title: "{:__('Image')}", width: 80, align: "center", templet: bdTable.api.formatter.image, operate: false },
                    { field: "parent_id", title: "{:__('Parent_id')}", width: 90, align: "center", operate: '=' },
                    { field: "items", title: "{:__('Items')}", width: 85, align: "center", operate: 'BETWEEN', sortable: true },
                    { field: "weigh", title: "{:__('Weigh')}", width: 85, align: "center", operate: 'BETWEEN', sortable: true },
                    { field: "status", title: "{:__('Status')}", width: 90, align: "center", searchList: {"normal": "normal", "hidden": "hidden"}, custom: { normal: "green", hidden: "orange" }, templet: bdTable.api.formatter.status },
                    { field: "createtime", title: "{:__('Createtime')}", width: 165, templet: bdTable.api.formatter.datetime, operate: false },
                    { title: "{:__('Operate')}", width: 130, align: "center", fixed: "right", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
