# ----------------------------------------------------------------------
# 项目社区信息交互平台 —— API 接口文档（OpenAPI 3.0）
# 生成时间：2026-10-23
# 接口：103 个（平台 /api/v1 共 78 个 + CMS /api/cms 共 25 个），93 个路径
# 参数：位置/类型由控制器源码提取，必填按接口语义标注。
# 鉴权：请求头 token: <access_token>；响应统一 {code,msg,data,request_id,time}。
# ----------------------------------------------------------------------
openapi: 3.0.3
info:
  title: 项目社区信息交互平台 API（含 CMS）
  version: 1.5.0
  description: |
    四角色（项目方 OWNER / 社区长 LEADER / 会员 MEMBER / 游客 VISITOR）社区信息交互平台后端接口。
    CMS 已前后端分离重构：无模板依赖，全部能力以 JSON 接口提供。
    平台 API 前缀 /api/v1；CMS API 前缀 /api/cms。不含 IM 即时通讯。
    国际化：接口可传查询参数 lang 或请求头 think-lang，查询参数优先；未显式指定时依次使用 think_lang Cookie、浏览器 Accept-Language 和默认语言（默认 zh-cn，可配置）。
    应用语言代码：zh-cn、en、zh-tw、ja、ko、fr、de、es、ru、ar、pt；不支持的语言使用当前默认语言。
    已接入翻译的业务展示字段仅返回已发布且原文版本一致的译文；缺少有效译文时回退原文。具体覆盖范围见 docs/i18n.md。
    广告图通过后台按语言配置独立记录，按语言筛选图片；与文本翻译的原文回退规则不同。
    API 缓存需区分语言；语言切换后重新请求数据，普通读取请求不会调用百度翻译 API。
servers:
  - url: /
security:
  - TokenAuth: []
tags:
  - name: 认证
  - name: 用户与角色
  - name: 套餐
  - name: 地区
  - name: 订阅与订单
  - name: 项目
  - name: 内容/资讯
  - name: 推荐与配额
  - name: 推流投放
  - name: 关系
  - name: 咨询（留言式）
  - name: "CMS-首页"
  - name: "CMS-栏目"
  - name: "CMS-内容"
  - name: "CMS-标签"
  - name: "CMS-搜索"
  - name: "CMS-评论"
  - name: "CMS-会员中心"
paths:
  /api/v1/auth/email/send-code:
    post:
      tags: [认证]
      summary: 发送邮箱验证码
      operationId: auth_sendCode
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: 邮箱地址
                event:
                  type: string
                  description: 事件 register/login/resetpwd
                  default: register
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/email/register:
    post:
      tags: [认证]
      summary: 邮箱注册
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code, password]
              properties:
                code:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱地址
                password:
                  type: string
                  description: 密码（≥6 位）
                nickname:
                  type: string
                  description: 昵称
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/email/login:
    post:
      tags: [认证]
      summary: 邮箱验证码登录
      operationId: auth_login
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code]
              properties:
                code:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱地址
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      operationId: auth_logout
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/wallet/challenge:
    post:
      tags: [认证]
      summary: 钱包登录-创建签名挑战
      operationId: auth_walletChallenge
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  description: 钱包地址（0x 开头 40 位十六进制）
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/wallet/verify:
    post:
      tags: [认证]
      summary: 钱包登录与注册-校验签名
      operationId: auth_walletVerify
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [address, signature]
              properties:
                address:
                  type: string
                  description: 钱包地址
                signature:
                  type: string
                  description: 以太坊 personal_sign 签名
                invite_code:
                  type: string
                  description: 推荐人邀请码（选填，仅新用户注册时生效）
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/wallet/tp-login:
    post:
      tags: [认证]
      summary: TokenPocket钱包DeepLink授权登录与注册
      description: |
        支持两种模式：
        1. 发起授权（action=init）：生成唤起 TP 钱包的 URL Scheme (tpoutside://) 与 Universal Link，生成防重放 SIWE 签名挑战；
        2. 验签登入/注册（action=verify 或携带 signature）：校验以太坊签名，已存在用户直接登录，未注册用户自动注册为游客并绑定邀请关系。
      operationId: auth_tpLoginPost
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [init, verify, check]
                  description: 动作类型，默认根据传参自动判定
                address:
                  type: string
                  description: 钱包地址（0x 开头 40 位十六进制）
                signature:
                  type: string
                  description: 钱包签名数据（验签时必填）
                ticket:
                  type: string
                  description: 授权票据编号（验签或查询时传入）
                message:
                  type: string
                  description: 原始签名消息（可选，若无 ticket 时需提供）
                invite_code:
                  type: string
                  description: 推荐人邀请码（新用户自动注册时绑定）
                callback_url:
                  type: string
                  description: 自定义回调/回跳 Scheme 或 URL
                chain_id:
                  type: integer
                  default: 1
                  description: 链 ID（默认 1 以太坊主网）
                dapp_name:
                  type: string
                  default: ITIK
                  description: 钱包弹窗中展示的应用名称
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      tags: [认证]
      summary: 轮询查询TP钱包授权状态
      description: 供移动端或前端轮询授权进度，返回 pending（等待签名中） / success（登录成功并包含 Token） / expired（已过期）
      operationId: auth_tpLoginGet
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: 授权会话票据
          schema:
            type: string
      responses:
        "200":
          description: 统一响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
