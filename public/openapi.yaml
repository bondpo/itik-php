# ----------------------------------------------------------------------
# 项目社区信息交互平台 —— API 接口文档（OpenAPI 3.0）
# 生成时间：2026-10-13 02:20
# 接口：95 个（平台 /api/v1 共 70 个 + CMS /api/cms 共 25 个），85 个路径
# 参数：位置/类型由控制器源码提取，必填按接口语义标注。
# 鉴权：请求头 token: <access_token>；响应统一 {code,msg,data,request_id,time}。
# ----------------------------------------------------------------------
openapi: 3.0.3
info:
  title: 项目社区信息交互平台 API（含 CMS）
  version: 1.5.0
  description: |
    四角色（项目方 OWNER / 社区长 LEADER / 会员 MEMBER / 游客 VISITOR）社区信息交互平台后端接口。
    CMS 已前后端分离重构：无模板依赖，全部能力以 JSON 接口提供。
    平台 API 前缀 /api/v1；CMS API 前缀 /api/cms。不含 IM 即时通讯。
servers:
  - url: /
security:
  - TokenAuth: []
tags:
  - name: 认证
  - name: 用户与角色
  - name: 套餐
  - name: 订阅与订单
  - name: 项目
  - name: 内容/资讯
  - name: 推荐与配额
  - name: 推流投放
  - name: 关系
  - name: 咨询（留言式）
  - name: "CMS-首页"
  - name: "CMS-栏目"
  - name: "CMS-内容"
  - name: "CMS-标签"
  - name: "CMS-搜索"
  - name: "CMS-评论"
  - name: "CMS-会员中心"
paths:
  /api/v1/auth/email/send-code:
    post:
      tags: [认证]
      summary: 发送邮箱验证码
      operationId: auth_sendCode
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: 邮箱地址
                event:
                  type: string
                  description: 事件 register/login/resetpwd
                  default: register
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/email/register:
    post:
      tags: [认证]
      summary: 邮箱注册
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code, password]
              properties:
                code:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱地址
                password:
                  type: string
                  description: 密码（≥6 位）
                nickname:
                  type: string
                  description: 昵称
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/email/login:
    post:
      tags: [认证]
      summary: 邮箱验证码登录
      operationId: auth_login
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code]
              properties:
                code:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱地址
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      operationId: auth_logout
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/wallet/challenge:
    post:
      tags: [认证]
      summary: "钱包登录-创建签名挑战（未开放）"
      operationId: auth_walletChallenge
      security: []
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/wallet/verify:
    post:
      tags: [认证]
      summary: "钱包登录-校验签名（未开放）"
      operationId: auth_walletVerify
      security: []
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/me:
    get:
      tags: [用户与角色]
      summary: 当前用户档案（角色+订阅状态）
      operationId: user_me
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags: [用户与角色]
      summary: 更新我的资料
      operationId: user_update
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/me/identities:
    get:
      tags: [用户与角色]
      summary: 已绑定身份（脱敏）
      operationId: user_identities
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/me/subscription:
    get:
      tags: [用户与角色]
      summary: 当前订阅与历史
      operationId: user_subscription
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/roles/plans:
    get:
      tags: [套餐]
      summary: 套餐列表
      operationId: plan_index
      security: []
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/orders:
    get:
      tags: [订阅与订单]
      summary: 我的订单列表
      operationId: billing_orders
      parameters:
        - name: status
          in: query
          required: false
          description: 状态筛选
          schema:
            type: string
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags: [订阅与订单]
      summary: 创建订单（幂等）
      operationId: billing_createOrder
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code:
                  type: string
                  description: 套餐代码
                coupon_code:
                  type: string
                  description: 优惠码
                idempotent_key:
                  type: string
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/orders/detail:
    get:
      tags: [订阅与订单]
      summary: 订单详情
      operationId: billing_orderDetail
      parameters:
        - name: order_no
          in: query
          required: true
          description: 订单号
          schema:
            type: string
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/orders/close:
    post:
      tags: [订阅与订单]
      summary: 关闭未支付订单
      operationId: billing_closeOrder
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no:
                  type: string
                  description: 订单号
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/subscription:
    get:
      tags: [订阅与订单]
      summary: 当前订阅（含剩余天数）
      operationId: billing_subscription
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/subscription/renew:
    post:
      tags: [订阅与订单]
      summary: 续费（有效期顺延）
      operationId: billing_renew
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  description: 套餐代码
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/billing/pay/notify:
    post:
      tags: [订阅与订单]
      summary: 支付回调（渠道服务端调用）
      operationId: billing_notify
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no:
                  type: string
                  description: 订单号
                pay_type:
                  type: string
                  description: 支付渠道标识
                sign:
                  type: string
                  description: 签名（开启验签时必填）
                trade_no:
                  type: string
                  description: 第三方/链上交易号
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/categories:
    get:
      tags: [项目]
      summary: 项目赛道分类列表（支持树形层级与项目数统计）
      operationId: project_categories
      security: []
      parameters:
        - name: tree
          in: query
          required: false
          description: 是否返回树形层级（1=树形嵌套，0=平铺列表）
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          required: false
          description: 状态筛选（normal=启用）
          schema:
            type: string
            default: normal
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects:
    get:
      tags: [项目]
      summary: 项目列表
      operationId: project_index
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: 项目赛道分类 ID 筛选（支持级联父分类）
          schema:
            type: integer
            default: 0
        - name: certified
          in: query
          required: false
          description: 是否已认证 1/0
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 搜索关键词
          schema:
            type: string
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags: [项目]
      summary: 创建项目（项目方+有效订阅）
      operationId: project_save
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                category_id:
                  type: integer
                  description: 所属项目分类 ID
                  default: 0
                name:
                  type: string
                  description: 名称
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/detail:
    get:
      tags: [项目]
      summary: 项目详情
      operationId: project_detail
      security: []
      parameters:
        - name: id
          in: query
          required: true
          description: 资源 ID
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/update:
    post:
      tags: [项目]
      summary: 编辑项目（已通过则回到待审）
      operationId: project_update
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                category_id:
                  type: integer
                  description: 所属项目分类 ID
                  default: 0
                id:
                  type: integer
                  description: 资源 ID
                  default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/submit:
    post:
      tags: [项目]
      summary: 提交审核
      operationId: project_submit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: 资源 ID
                  default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/materials:
    get:
      tags: [项目]
      summary: 项目资料列表
      operationId: project_materials
      parameters:
        - name: project_id
          in: query
          required: true
          description: 项目 ID
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags: [项目]
      summary: 上传项目资料（进入审核）
      operationId: project_addMaterial
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [project_id, category, type, storage_key]
              properties:
                category:
                  type: string
                  description: 分类（license/brand/project）
                  default: project
                project_id:
                  type: integer
                  description: 项目 ID
                  default: 0
                storage_key:
                  type: string
                  description: 已上传文件路径
                type:
                  type: string
                  description: 类型
                copyright_owner:
                  type: string
                  description: 版权责任方（社区长上传必填）
                source:
                  type: string
                  description: 来源说明（社区长上传必填）
                title:
                  type: string
                  description: 标题
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/members:
    get:
      tags: [项目]
      summary: 项目团队/社区长列表
      operationId: project_members
      parameters:
        - name: project_id
          in: query
          required: true
          description: 项目 ID
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/members/bind:
    post:
      tags: [项目]
      summary: 绑定社区长（001号推荐官）
      operationId: project_bindLeader
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [project_id, user_id]
              properties:
                project_id:
                  type: integer
                  description: 项目 ID
                  default: 0
                user_id:
                  type: integer
                  description: 用户 ID
                  default: 0
                serial_no:
                  type: string
                title:
                  type: string
                  description: 标题
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/stats:
    get:
      tags: [项目]
      summary: 项目数据看板
      operationId: project_stats
      parameters:
        - name: project_id
          in: query
          required: true
          description: 项目 ID
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/timelines:
    get:
      tags: [项目]
      summary: 项目发展历程与里程碑时间轴（公开）
      operationId: project_timelines
      security: []
      parameters:
        - name: project_id
          in: query
          required: true
          description: 项目 ID
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags: [项目]
      summary: 项目方发布里程碑时间轴节点
      operationId: project_addTimeline
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [project_id, title]
              properties:
                project_id:
                  type: integer
                  description: 项目 ID
                  default: 0
                title:
                  type: string
                  description: 里程碑事件标题
                tag:
                  type: string
                  description: 标签/事件类型
                  default: 里程碑
                event_time:
                  type: string
                  description: 事件发生时间（日期 YYYY-MM-DD 或秒级时间戳）
                summary:
                  type: string
                  description: 摘要简述
                content:
                  type: string
                  description: 详情正文
                link_url:
                  type: string
                  description: 相关链接
                weigh:
                  type: integer
                  description: 排序权重（数值越大越靠前）
                  default: 0
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/timelines/update:
    post:
      tags: [项目]
      summary: 项目方编辑里程碑时间轴节点
      operationId: project_updateTimeline
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: 时间轴节点 ID
                  default: 0
                title:
                  type: string
                  description: 里程碑事件标题
                tag:
                  type: string
                  description: 标签/事件类型
                event_time:
                  type: string
                  description: 事件发生时间（日期 YYYY-MM-DD 或秒级时间戳）
                summary:
                  type: string
                  description: 摘要简述
                content:
                  type: string
                  description: 详情正文
                link_url:
                  type: string
                  description: 相关链接
                weigh:
                  type: integer
                  description: 排序权重
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/projects/timelines/delete:
    post:
      tags: [项目]
      summary: 项目方删除里程碑时间轴节点
      operationId: project_deleteTimeline
