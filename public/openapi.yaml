components:
  parameters:
    LanguageQuery:
      name: lang
      in: query
      required: false
      description: 展示语言，优先于 think-lang 请求头；请传应用语言代码，日语为 ja
      schema:
        type: string
        enum: [zh-cn, en, zh-tw, ja, ko, fr, de, es, ru, ar, pt]
        example: en
    LanguageHeader:
      name: think-lang
      in: header
      required: false
      description: lang 查询参数未传时使用的展示语言
      schema:
        type: string
        enum: [zh-cn, en, zh-tw, ja, ko, fr, de, es, ru, ar, pt]
        example: en
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
      description: 登录接口返回的 access token
  schemas:
    CmsBlock:
      type: object
      description: 广告区块；图片地址保留已有存储格式，前端沿用原有图片地址处理方式
      properties:
        id: { type: integer, description: 区块 ID }
        type: { type: string, nullable: true, description: 区块类型 }
        name: { type: string, nullable: true, description: 区块标识，例如 indexfocus }
        title: { type: string, nullable: true, description: 标题 }
        image: { type: string, nullable: true, description: 此条语言版本的图片地址 }
        url: { type: string, nullable: true, description: 点击跳转地址 }
        content: { type: string, nullable: true, description: 区块内容 }
        weigh: { type: integer, description: 排序权重，值越大越靠前 }
        begintime: { type: integer, nullable: true, description: 开始时间戳，0 或 null 表示不限 }
        endtime: { type: integer, nullable: true, description: 结束时间戳，0 或 null 表示不限 }
        lang: { type: string, description: 展示语言代码，空字符串表示所有语言通用, example: en }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, description: "1 成功，其它为错误码" }
        msg: { type: string, description: 提示信息 }
        data: { nullable: true, description: 业务数据 }
        request_id: { type: string, description: 请求追踪 ID }
        time: { type: integer, description: 服务端时间戳 }
    ErrorCodes:
      type: object
      description: 分段错误码表
      properties:
        "1": { type: string, description: 成功 }
        "10001": { type: string, description: 参数不合法 }
        "10002": { type: string, description: 缺少必填参数 }
        "20001": { type: string, description: 未登录/令牌无效 }
        "20002": { type: string, description: 无权限（含关系 ACL、会话归属） }
        "20003": { type: string, description: 角色不符 }
        "20004": { type: string, description: 订阅状态不满足 }
        "30001": { type: string, description: 业务失败 }
        "30002": { type: string, description: 资源不存在 }
        "30003": { type: string, description: 状态不允许 }
        "30004": { type: string, description: 重复操作 }
        "40001": { type: string, description: 风控拒绝 }
        "40002": { type: string, description: 频控限制（含推荐配额用尽） }
        "50001": { type: string, description: 系统错误 }
