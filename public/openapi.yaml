  /api/cms/index:
    get:
      tags: ["CMS-首页"]
      summary: 首页聚合数据（含按语言筛选的广告图）
      description: |
        返回 config、channels、blocks、hot、latest。
        示例：GET /api/cms/index?lang=en。
        blocks 仅包含通用广告（lang 为空字符串）和当前语言广告；两者一起展示，并非互相覆盖。
        同一广告位需要不同语言图片时，在后台分别新增广告并指定展示语言，避免保留重复的通用版本。
        仅返回正常状态且在有效期内的广告，按 weigh 降序、id 降序排列，筛选后最多返回 6 条。
        未配置当前语言广告时仅显示通用广告，不回退其他语言广告；不存在符合条件的数据时返回空数组。
        广告图片由后台分别上传，不调用百度翻译，也不依赖机器翻译开关。
      operationId: index_index
      security: []
      parameters:
        - $ref: "#/components/parameters/LanguageQuery"
        - $ref: "#/components/parameters/LanguageHeader"
        - name: limit
          in: query
          required: false
          description: hot、latest 各自返回的最多条数；不影响 blocks（最多 6 条）
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 6
      responses:
        "200":
          description: 统一响应；code=1 成功，其它为错误码（HTTP 状态仍为 200）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          config: { type: object, description: 站点公开配置 }
                          channels: { type: array, items: { type: object }, description: 栏目树 }
                          blocks:
                            type: array
                            maxItems: 6
                            description: 通用广告和当前语言广告，前端继续使用 image、url 渲染
                            items:
                              $ref: "#/components/schemas/CmsBlock"
                          hot: { type: array, items: { type: object }, description: 热门内容 }
                          latest: { type: array, items: { type: object }, description: 最新内容 }
              examples:
                englishBanners:
                  summary: 英语请求的广告字段示例（省略其他聚合字段）
                  value:
                    code: 1
                    msg: ""
                    data:
                      blocks:
                        - { id: 12, type: image, name: indexfocus, title: English banner, image: /uploads/banner-en.jpg, url: /projects, content: "", weigh: 12, begintime: 0, endtime: 0, lang: en }
                        - { id: 1, type: image, name: indexfocus, title: 通用广告, image: /uploads/banner-common.jpg, url: /projects, content: "", weigh: 1, begintime: 0, endtime: 0, lang: "" }
