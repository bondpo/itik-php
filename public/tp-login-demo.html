<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenPocket 钱包 DeepLink 授权登录对接用例 - ITIK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-card: rgba(22, 24, 38, 0.8);
            --bg-input: rgba(14, 16, 26, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #2980fe;
            --accent-gradient: linear-gradient(135deg, #2980fe 0%, #6366f1 50%, #8b5cf6 100%);
            --accent-glow: rgba(41, 128, 254, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 16px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(41, 128, 254, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(41, 128, 254, 0.15);
            border: 1px solid rgba(41, 128, 254, 0.3);
            color: #60a5fa;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            margin-top: 10px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-box {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .dot.pending {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
            animation: pulse 1.5s infinite;
        }

        .dot.success {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 16px 0;
            padding: 14px;
            background: #fff;
            border-radius: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .code-block {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #94a3b8;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 220px;
        }

        .user-info {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 14px;
            margin-top: 14px;
            font-size: 13px;
        }

        .user-info div {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .user-info span:first-child {
            color: var(--text-secondary);
        }

        .user-info span:last-child {
            font-weight: 500;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="badge">EIP-4361 / SIWE 规范</div>
        <h1>TokenPocket 钱包 DeepLink 授权登入与注册</h1>
        <p class="subtitle">移动端 Scheme / Universal Link 唤起、签名验签与长轮询接入用例</p>
    </header>

    <div class="grid">
        <!-- 左侧：发起与控制 -->
        <div class="card">
            <div class="card-title">📱 1. 发起授权与唤起</div>
            
            <div class="form-group">
                <label>钱包地址 (可选，留空则由签名公钥自动还原):</label>
                <input type="text" id="iptAddress" placeholder="0x... (可选)" value="0x380d7f00d4bb7870cad919837269636c8420d3bd">
            </div>

            <div class="form-group">
                <label>推荐人邀请码 (可选):</label>
                <input type="text" id="iptInviteCode" placeholder="如 VITALIK1">
            </div>

            <div class="form-group">
                <label>回调 Scheme / URL (可选):</label>
                <input type="text" id="iptCallbackUrl" value="myapp://auth/callback">
            </div>

            <button class="btn btn-primary" id="btnInit" onclick="initTpLogin()">
                🚀 1. 获取 DeepLink 授权协议
            </button>

            <div id="actionButtons" style="display: none; margin-top: 14px;">
                <a id="btnDeepLink" href="#" class="btn btn-secondary" style="background: rgba(41, 128, 254, 0.2); border: 1px solid #2980fe;">
                    📲 在 TP 钱包中打开 (Scheme)
                </a>
                <a id="btnUniversalLink" href="#" target="_blank" class="btn btn-secondary">
                    🌐 使用 Universal Link 打开 (iOS推荐)
                </a>
            </div>
        </div>

        <!-- 右侧：状态监听与二维码 -->
        <div class="card">
            <div class="card-title">🔄 2. 授权状态与监听</div>

            <div class="status-box">
                <div class="status-indicator">
                    <div class="dot" id="statusDot"></div>
                    <span id="statusText">等待发起授权</span>
                </div>
                <span id="pollCounter" style="font-size: 12px; color: var(--text-muted);"></span>
            </div>

            <div id="qrContainer" style="display: none;">
                <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">
                    手机打开 TokenPocket 扫码授权登录:
                </p>
                <div class="qr-wrapper" id="qrcode"></div>
            </div>

            <div id="resultBlock" style="display: none;">
                <div class="user-info" id="userInfoBox"></div>
            </div>
        </div>
    </div>

    <!-- 底部：报文详情 -->
    <div class="card">
        <div class="card-title">🔍 3. 报文日志与协议调试 (Console Log)</div>
        <div class="code-block" id="logBox">// 请点击上方按钮发起 TP 钱包登录流程...</div>
    </div>
</div>

<script>
let currentTicket = null;
let pollTimer = null;
let pollCount = 0;

function log(msg, obj = null) {
    const logBox = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    let text = `[${time}] ${msg}`;
    if (obj) {
        text += '\n' + JSON.stringify(obj, null, 2);
    }
    logBox.textContent = text + '\n\n' + logBox.textContent;
}

// 1. 发起 TP 登录，获取 DeepLink 协议
async function initTpLogin() {
    clearInterval(pollTimer);
    const address = document.getElementById('iptAddress').value.trim();
    const inviteCode = document.getElementById('iptInviteCode').value.trim();
    const callbackUrl = document.getElementById('iptCallbackUrl').value.trim();

    log("正在向 /api/v1/auth/wallet/tp-login 发起初始化请求...");

    try {
        const res = await fetch('/api/v1/auth/wallet/tp-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                action: 'init',
                address: address,
                invite_code: inviteCode,
                callback_url: callbackUrl
            })
        });

        const json = await res.json();
        log("初始化接口响应:", json);

        if (json.code !== 1) {
            alert('获取失败: ' + json.msg);
            return;
        }

        const data = json.data;
        currentTicket = data.ticket;

        // 设置唤醒链接
        const btnDeepLink = document.getElementById('btnDeepLink');
        const btnUniversalLink = document.getElementById('btnUniversalLink');
        btnDeepLink.href = data.deeplink;
        btnUniversalLink.href = data.universal_link;

        document.getElementById('actionButtons').style.display = 'block';

        // 渲染二维码
        const qrContainer = document.getElementById('qrContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        qrcodeDiv.innerHTML = '';
        new QRCode(qrcodeDiv, {
            text: data.deeplink,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
        qrContainer.style.display = 'block';

        // 更新状态并开启轮询
        updateStatus('pending', '等待 TP 钱包签名授权...');
        startPolling(currentTicket);

    } catch (e) {
        log("请求异常:", e);
        alert("网络异常: " + e.message);
    }
}

// 2. 轮询 Ticket 状态
function startPolling(ticket) {
    pollCount = 0;
    const counterSpan = document.getElementById('pollCounter');
    
    pollTimer = setInterval(async () => {
        pollCount++;
        counterSpan.textContent = `轮询第 ${pollCount} 次...`;

        try {
            const res = await fetch(`/api/v1/auth/wallet/tp-login?ticket=${encodeURIComponent(ticket)}`);
            const json = await res.json();

            if (json.code === 1 && json.data) {
                if (json.data.status === 'success') {
                    clearInterval(pollTimer);
                    counterSpan.textContent = '';
                    updateStatus('success', '🎉 授权登录成功！');
                    log("轮询成功，获取到用户信息与 Token:", json.data);
                    renderUserInfo(json.data.data);
                } else if (json.data.status === 'expired') {
                    clearInterval(pollTimer);
                    counterSpan.textContent = '';
                    updateStatus('expired', '⚠️ 授权已过期，请重新发起');
                }
            }
        } catch (e) {
            console.error("轮询错误", e);
        }

        // 最多轮询 100 次（约 300 秒）
        if (pollCount >= 100) {
            clearInterval(pollTimer);
            updateStatus('expired', '轮询超时');
        }
    }, 3000);
}

// 更新状态 UI
function updateStatus(type, text) {
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusText');
    dot.className = 'dot ' + type;
    label.textContent = text;
}

// 渲染登录成功结果
function renderUserInfo(u) {
    const box = document.getElementById('userInfoBox');
    box.innerHTML = `
        <div><span>用户 ID:</span> <span>${u.user_id}</span></div>
        <div><span>用户名:</span> <span>${u.username}</span></div>
        <div><span>角色:</span> <span>${u.role}</span></div>
        <div><span>钱包地址:</span> <span style="font-family: monospace;">${u.wallet_address}</span></div>
        <div><span>新注册用户:</span> <span>${u.is_new_user ? '是 (自动注册)' : '否 (老用户直接登录)'}</span></div>
        <div><span>登录 Token:</span> <span style="color: #60a5fa; font-family: monospace;">${u.token}</span></div>
    `;
    document.getElementById('resultBlock').style.display = 'block';

    // 存储 Token 供后续 API 使用
    localStorage.setItem('auth_token', u.token);
}
</script>

</body>
</html>
